      : False,\n    \"local_floor_status\": (json.loads((root / \"derived\" / \"local_floor.json\").read_text(encoding=\"utf-8\")).get(\"status\")\n             \
      \              if (root / \"derived\" / \"local_floor.json\").is_file() else \"NOT_REPORTED\"),\n    \"local_floor_report\": \"derived/local_floor.json\" if\
      \ (root / \"derived\" / \"local_floor.json\").is_file() else None,\n    \"local_floor_csv\": \"derived/local_floor.csv\" if (root / \"derived\" / \"local_floor.csv\"\
      ).is_file() else None,\n    \"target_measurement_status\": (json.loads((root / \"derived\" / \"target-measurement.json\").read_text(encoding=\"utf-8\")).get(\"\
      status\")\n                                  if (root / \"derived\" / \"target-measurement.json\").is_file() else \"NOT_REPORTED\"),\n    \"target_measurement_report\"\
      : \"derived/target-measurement.json\" if (root / \"derived\" / \"target-measurement.json\").is_file() else None,\n    \"cleanup_receipt\": \"local-cleanup-receipt.json\"\
      ,\n    \"source_dataset_inventory_count\": len(inventory.get(\"datasets\", [])),\n    \"excluded_dataset_count\": 0 if profile == \"full-lossless\" else None,\n\
      \    \"future_reprocessing_note\": (\n        \"Full-lossless HDF5 archive retains all source datasets and attributes.\"\n        if profile == \"full-lossless\"\
      \ else\n        \"Derived-only: no HDF5 archive is retained; only validated outputs and provenance are preserved.\"\n    ),\n}\n(root / \"product-processing.json\"\
      ).write_text(json.dumps(metadata, indent=2), encoding=\"utf-8\")\nPY\n"
  - name: Upload validated per-product outputs to Drive with checksum verification
    id: drive
    env:
      ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
      MANIFEST_PATH: ${{ steps.archive.outputs.manifest_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
      RETENTION_PROFILE: ${{ env.RETENTION_PROFILE }}
    shell: bash
    run: "set -euo pipefail\nprintf 'PRODUCT_MILESTONE=drive_upload_started product_id=%s family=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\nmapfile -t derived_files\
      \ < <(find \"$CURATED_DIR/derived\" -type f -print | sort)\nfiles=(\n  \"$CURATED_DIR/source-inventory.json\" \"$CURATED_DIR/preflight-report.json\"\n  \"$CURATED_DIR/derived-output-validation.json\"\
      \ \"$CURATED_DIR/download-manifest.json\"\n  \"${derived_files[@]}\"\n)\nif [[ \"$RETENTION_PROFILE\" == \"full-lossless\" ]]; then\n  test -s \"$ARCHIVE_PATH\"\
      \ && test -s \"$MANIFEST_PATH\" && test -s \"$CURATED_DIR/reader-equivalence.json\"\n  files+=(\"$ARCHIVE_PATH\" \"$MANIFEST_PATH\" \"$CURATED_DIR/reader-equivalence.json\"\
      )\nelse\n  if [[ -n \"$ARCHIVE_PATH\" || -e \"$CURATED_DIR/reader-equivalence.json\" ]]; then\n    echo \"ERROR=UNEXPECTED_ARCHIVE_ARTIFACT_IN_DERIVED_ONLY\"\
      \ >&2\n    exit 2\n  fi\nfi\nretry_upload_flags=()\nif [[ \"$PRODUCT_EXECUTION_LABEL\" != \"initial\" ]]; then\n  # The version-tag is unique to this workflow\
      \ run/attempt.\n  retry_upload_flags+=(--existing-files-are-new)\nfi\nif [[ \"${{ steps.source_identity.outputs.same_source || 'false' }}\" == \"true\" ]];\
      \ then\n  retry_upload_flags+=(--replace-existing-retry-sidecars)\nfi\npython tools/drive_resumable_upload.py \"${retry_upload_flags[@]}\" \\\n  --root \"$CURATED_DIR\"\
      \ --product-type \"$PRODUCT_TYPE\" --maturity \"$MATURITY\" \\\n  --granule-name \"$GRANULE_NAME\" --version-tag \"$DRIVE_VERSION_TAG\" --files \"${files[@]}\"\
      \ \\\n  --job-id \"$DRIVE_JOB_ID\" \\\n  --out \"$CURATED_DIR/drive-retention-receipt.json\"\npython - <<'PY'\nimport json, os\nfrom pathlib import Path\nroot=Path(os.environ[\"\
      CURATED_DIR\"])\nreceipt=json.loads((root/\"drive-retention-receipt.json\").read_text(encoding=\"utf-8\"))\nmeta_path=root/\"product-processing.json\"\nmeta=json.loads(meta_path.read_text(encoding=\"\
      utf-8\"))\nif receipt.get(\"remote_verification\") != \"PASS\":\n    raise SystemExit(\"ERROR=DRIVE_OUTPUTS_NOT_REMOTELY_VERIFIED\")\nuploaded={str(item.get(\"\
      name\",\"\")) for item in receipt.get(\"files\", [])}\nrequired={\"source-inventory.json\",\"preflight-report.json\",\"derived-output-validation.json\",\"download-manifest.json\"\
      }\nrequired.add(Path(meta[\"stats_csv\"]).name)\nrequired.update(Path(rel).name for rel in meta[\"export_files\"])\nmissing=sorted(required-uploaded)\nif missing:\n\
      \    raise SystemExit(\"ERROR=REMOTE_OUTPUT_MISSING names=\"+\",\".join(missing))\narchives=[name for name in uploaded if name.endswith(\".science.h5\")]\n\
      if meta[\"retention_profile\"] == \"full-lossless\" and len(archives) != 1:\n    raise SystemExit(\"ERROR=FULL_LOSSLESS_ARCHIVE_NOT_FOUND_IN_DRIVE_RECEIPT\"\
      )\nif meta[\"retention_profile\"] == \"derived-only\" and archives:\n    raise SystemExit(\"ERROR=ARCHIVE_PRESENT_IN_DERIVED_ONLY_DRIVE_RECEIPT\")\nmeta[\"\
      drive_remote_verification\"]=\"PASS\"\nmeta[\"drive_remote_folder_id\"]=receipt.get(\"remote_folder_id\")\nmeta[\"drive_retention_receipt\"]=\"drive-retention-receipt.json\"\
      \nmeta_path.write_text(json.dumps(meta,indent=2),encoding=\"utf-8\")\nPY\nmetadata_retry_flags=()\nif [[ \"$PRODUCT_EXECUTION_LABEL\" != \"initial\" ]]; then\n\
      \  metadata_retry_flags+=(--existing-files-are-new)\nfi\nif [[ \"${{ steps.source_identity.outputs.same_source || 'false' }}\" == \"true\" ]]; then\n  metadata_retry_flags+=(--replace-existing-retry-sidecars)\n\
      fi\npython tools/drive_resumable_upload.py \"${metadata_retry_flags[@]}\" \\\n  --root \"$CURATED_DIR\" --product-type \"$PRODUCT_TYPE\" --maturity \"$MATURITY\"\
      \ \\\n  --granule-name \"$GRANULE_NAME\" --version-tag \"$DRIVE_VERSION_TAG\" \\\n  --job-id \"$DRIVE_JOB_ID\" \\\n  --files \"$CURATED_DIR/product-processing.json\"\
      \ \"$CURATED_DIR/drive-retention-receipt.json\" \\\n  --out \"$CURATED_DIR/drive-metadata-upload-receipt.json\"\npython - <<'PY'\nimport json, os\nfrom pathlib\
      \ import Path\nroot=Path(os.environ[\"CURATED_DIR\"])\nreceipt=json.loads((root/\"drive-metadata-upload-receipt.json\").read_text(encoding=\"utf-8\"))\nif receipt.get(\"\
      remote_verification\") != \"PASS\":\n    raise SystemExit(\"ERROR=DRIVE_METADATA_NOT_REMOTELY_VERIFIED\")\nuploaded={str(item.get(\"name\",\"\")) for item in\
      \ receipt.get(\"files\", [])}\nif not {\"product-processing.json\",\"drive-retention-receipt.json\"}.issubset(uploaded):\n    raise SystemExit(\"ERROR=DRIVE_METADATA_RECEIPT_FILES_MISSING\"\
      )\nprint(f\"DRIVE_VALIDATED_OUTPUTS_VERIFIED={len(receipt.get('files', []))}\")\nPY\nprintf 'PRODUCT_MILESTONE=drive_upload_completed product_id=%s family=%s\
      \ status=PASS\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\n"
  - name: Write a compact diagnostic receipt even when a product fails
    if: always()
    env:
      RUN_ROOT: ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}
      DOWNLOAD_LOG: ${{ runner.temp }}/sarguardian-download-${{ inputs.product_id }}.log
      DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
      AOI_PREFLIGHT_OUTCOME: ${{ steps.aoi_preflight.outcome }}
      ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
      READER_EQUIVALENCE_OUTCOME: ${{ steps.reader_equivalence.outcome }}
      READER_OUTCOME: ${{ steps.reader.outcome }}
      DRIVE_OUTCOME: ${{ steps.drive.outcome }}
    shell: bash
    run: "set -euo pipefail\nmkdir -p \"$RUN_ROOT/curated\"\npython - <<'PY'\nimport json, os\nfrom pathlib import Path\nroot = Path(os.environ[\"RUN_ROOT\"])\ncurated\
      \ = root / \"curated\"\ndownload_log = Path(os.environ[\"DOWNLOAD_LOG\"])\ndiagnostic_prefixes = (\n    \"ERROR=\",\n    \"DIRECT_PRODUCT_DIAGNOSTIC=\",\n \
      \   \"SOURCE_ACQUISITION_MODULE=\",\n    \"DISCOVERY_FALLBACK=\",\n    \"DIRECT_PRODUCT_HTTP_404=\",\n    \"NETWORK_RETRY=\",\n    \"DOWNLOAD_FAILURE_RETRYABLE=\"\
      ,\n)\ndownload_diagnostics = []\nif download_log.is_file():\n    for raw_line in download_log.read_text(encoding=\"utf-8\", errors=\"replace\").splitlines():\n\
      \        line = raw_line.strip()\n        if line.startswith(diagnostic_prefixes):\n            download_diagnostics.append(line[:420])\ndownload_diagnostics\
      \ = download_diagnostics[:16]\ndownload_error_code = next(\n    (line for line in download_diagnostics if line.startswith(\"ERROR=\")),\n    None,\n) if os.environ.get(\"\
      DOWNLOAD_OUTCOME\") == \"failure\" else None\nrecord = {\n    \"schema_version\": \"sarguardian-product-run-diagnostic/1.0\",\n    \"product_id\": os.environ.get(\"\
      PRODUCT_ID\"),\n    \"product_type\": os.environ.get(\"PRODUCT_TYPE\"),\n    \"granule_name\": os.environ.get(\"GRANULE_NAME\"),\n    \"aoi\": os.environ[\"\
      AOI_NAME\"],\n    \"science_commit\": os.environ.get(\"SCIENCE_COMMIT\"),\n    \"step_outcomes\": {\n        \"download\": os.environ.get(\"DOWNLOAD_OUTCOME\"\
      ),\n        \"aoi_preflight\": os.environ.get(\"AOI_PREFLIGHT_OUTCOME\"),\n        \"archive\": os.environ.get(\"ARCHIVE_OUTCOME\"),\n        \"reader_equivalence\"\
      : os.environ.get(\"READER_EQUIVALENCE_OUTCOME\"),\n        \"reader\": os.environ.get(\"READER_OUTCOME\"),\n        \"drive\": os.environ.get(\"DRIVE_OUTCOME\"\
      ),\n    },\n    \"download_error_code\": download_error_code,\n    \"download_diagnostics\": download_diagnostics,\n    \"download_manifest_created\": (curated\
      \ / \"download-manifest.json\").is_file(),\n    \"raw_hdf5_present_at_diagnostic_time\": any(root.glob(\"raw/**/*.h5\")),\n    \"retained_archive_created\"\
      : any((curated / \"archive\").glob(\"*.science.h5\")),\n    \"drive_receipt_created\": (curated / \"drive-retention-receipt.json\").is_file(),\n    \"local_raw_delete_step_is_gated_on_success\"\
      : True,\n}\n(curated / \"product-run-diagnostics.json\").write_text(\n    json.dumps(record, indent=2, ensure_ascii=False) + \"\\n\", encoding=\"utf-8\"\n)\n\
      print(\"PRODUCT_RUN_DIAGNOSTICS_WRITTEN=\" + str(curated / \"product-run-diagnostics.json\"))\nPY\n"
  - name: Upload verified per-granule checkpoint for final aggregation
    if: always() && (inputs.execution_label == 'initial' || steps.drive.outcome == 'success')
