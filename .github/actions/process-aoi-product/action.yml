      )\nprint(\"LOCAL_CLEANUP_RECEIPT_DRIVE_VERIFIED=PASS\")\nPY\nprintf 'PRODUCT_MILESTONE=cleanup_completed product_id=%s family=%s status=PASS\\n' \\\n  \"$PRODUCT_ID\"\
      \ \"$PRODUCT_TYPE\"\n"
  - name: Upload verified post-cleanup checkpoint for aggregation
    if: always() && (inputs.execution_label == 'initial' || steps.cleanup.outcome == 'success')
    uses: actions/upload-artifact@v4
    with:
      name: sarguardian-cleanup-${{ inputs.product_id }}
      overwrite: true
      path: '${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/local-cleanup-receipt.json

        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/drive-cleanup-upload-receipt.json

        '
      if-no-files-found: warn
      retention-days: 14
  - name: Preserve retry cleanup diagnostics without replacing a prior checkpoint
    if: always() && inputs.execution_label != 'initial' && steps.cleanup.outcome != 'success'
    uses: actions/upload-artifact@v4
    with:
      name: sarguardian-retry-cleanup-diagnostic-${{ inputs.product_id }}-${{ inputs.execution_label }}
      path: '${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/local-cleanup-receipt.json

        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/drive-cleanup-upload-receipt.json

        '
      if-no-files-found: warn
      retention-days: 14
  - name: Report product completion status
    if: always()
    env:
      DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
      AOI_PREFLIGHT_OUTCOME: ${{ steps.aoi_preflight.outcome }}
      READER_OUTCOME: ${{ steps.reader.outcome }}
      DERIVED_VALIDATION_OUTCOME: ${{ steps.derived_validation.outcome }}
      DRIVE_OUTCOME: ${{ steps.drive.outcome }}
      CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
    shell: bash
    run: "set -euo pipefail\nstatus=failed\nif [[ \"$CLEANUP_OUTCOME\" == \"success\" ]]; then status=completed; fi\nprintf 'PRODUCT_PROCESSING_STATUS=%s product_id=%s\
      \ family=%s execution=%s download=%s aoi_validation=%s reader=%s derived_validation=%s upload=%s cleanup=%s\\n' \\\n  \"$status\" \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\
      \ \"$PRODUCT_EXECUTION_LABEL\" \\\n  \"$DOWNLOAD_OUTCOME\" \"$AOI_PREFLIGHT_OUTCOME\" \"$READER_OUTCOME\" \\\n  \"$DERIVED_VALIDATION_OUTCOME\" \"$DRIVE_OUTCOME\"\
      \ \"$CLEANUP_OUTCOME\"\n"
