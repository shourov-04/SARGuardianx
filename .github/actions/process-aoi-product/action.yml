# Generated from sarguardian-aoi-product-worker.yml.
name: Process one SARGuardian AOI product
description: Run one isolated product attempt inside a balanced batch runner.
inputs:
  aoi_wkt:
    required: true
  product_id:
    required: true
  granule_name:
    required: true
  product_type:
    required: true
  maturity:
    required: true
  expected_source_bytes:
    required: true
  retention_profile:
    required: true
  execution_label:
    required: true
  job_id:
    required: false
    default: ''
  target_latitude:
    required: false
    default: ''
  target_longitude:
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Initialize isolated product attempt
    shell: bash
    env:
      ACTION_PRODUCT_ID: ${{ inputs.product_id }}
      ACTION_GRANULE_NAME: ${{ inputs.granule_name }}
      ACTION_PRODUCT_TYPE: ${{ inputs.product_type }}
      ACTION_MATURITY: ${{ inputs.maturity }}
      ACTION_EXPECTED_SOURCE_BYTES: ${{ inputs.expected_source_bytes }}
      ACTION_RETENTION_PROFILE: ${{ inputs.retention_profile }}
      ACTION_EXECUTION_LABEL: ${{ inputs.execution_label }}
      ACTION_JOB_ID: ${{ inputs.job_id }}
      ACTION_TARGET_LATITUDE: ${{ inputs.target_latitude }}
      ACTION_TARGET_LONGITUDE: ${{ inputs.target_longitude }}
    run: "set -euo pipefail\nif [[ ! \"$ACTION_PRODUCT_ID\" =~ ^(GUNW|GOFF)-[0-9]{3}$ ]]; then\n  echo \"ERROR=INVALID_BATCH_PRODUCT_ID\" >&2\n  exit 2\nfi\nproduct_root=\"\
      $RUNNER_TEMP/sarguardian-stream/$ACTION_PRODUCT_ID\"\nprior_root=\"$RUNNER_TEMP/sarguardian-stream/prior-attempt/granule\"\nif [[ \"$ACTION_EXECUTION_LABEL\"\
      \ != \"initial\" ]]; then\n  case \"$product_root\" in \"$RUNNER_TEMP\"/sarguardian-stream/*) rm -rf -- \"$product_root\" ;; *) exit 2 ;; esac\n  case \"$prior_root\"\
      \ in \"$RUNNER_TEMP\"/sarguardian-stream/*) rm -rf -- \"$prior_root\" ;; *) exit 2 ;; esac\nfi\n{\n  printf 'PRODUCT_ID=%s\n' \"$ACTION_PRODUCT_ID\"\n  printf\
      \ 'GRANULE_NAME=%s\n' \"$ACTION_GRANULE_NAME\"\n  printf 'PRODUCT_TYPE=%s\n' \"$ACTION_PRODUCT_TYPE\"\n  printf 'MATURITY=%s\n' \"$ACTION_MATURITY\"\n  printf\
      \ 'EXPECTED_SOURCE_BYTES=%s\n' \"$ACTION_EXPECTED_SOURCE_BYTES\"\n  printf 'RETENTION_PROFILE=%s\n' \"$ACTION_RETENTION_PROFILE\"\n  printf 'PRODUCT_EXECUTION_LABEL=%s\n\
      ' \"$ACTION_EXECUTION_LABEL\"\n  printf 'DRIVE_JOB_ID=%s\n' \"$ACTION_JOB_ID\"\n  printf 'TARGET_LATITUDE=%s\n' \"$ACTION_TARGET_LATITUDE\"\n  printf 'TARGET_LONGITUDE=%s\n\
      ' \"$ACTION_TARGET_LONGITUDE\"\n  printf 'DRIVE_VERSION_TAG=%s-%s-%s\n' \"$GITHUB_RUN_ID\" \"$GITHUB_RUN_ATTEMPT\" \"$ACTION_EXECUTION_LABEL\"\n} >> \"$GITHUB_ENV\"\
      \n"
  - name: Download first-attempt evidence for retry identity checks
    if: inputs.execution_label != 'initial'
    continue-on-error: true
    uses: actions/download-artifact@v4
    with:
      name: sarguardian-granule-${{ inputs.product_id }}
      path: ${{ runner.temp }}/sarguardian-stream/prior-attempt/granule
  - name: Create isolated one-product scratch folders
    id: paths
    shell: bash
    run: "set -euo pipefail\nroot=\"$RUNNER_TEMP/sarguardian-stream/$PRODUCT_ID\"\nmkdir -p \"$root/raw\" \"$root/curated/archive\" \"$root/curated/derived\"\nchmod\
      \ 700 \"$root\" \"$root/raw\" \"$root/curated\"\necho \"raw_dir=$root/raw\" >> \"$GITHUB_OUTPUT\"\necho \"curated_dir=$root/curated\" >> \"$GITHUB_OUTPUT\"\n\
      printf 'PRODUCT_PROCESSING_START product_id=%s family=%s execution=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\" \"$PRODUCT_EXECUTION_LABEL\"\n"
  - name: Download exactly one raw NISAR granule
    id: download
    shell: bash
    env:
      RAW_DIR: ${{ steps.paths.outputs.raw_dir }}
    run: "set -euo pipefail\nlog=\"$RUNNER_TEMP/sarguardian-download-$PRODUCT_ID.log\"\n: > \"$log\"\n# Do not redownload a multi-GB product after a failed whole-product\
      \ attempt.\nmax_attempts=1\nattempt=1\ndownload_ok=0\ndownload_status=1\nwhile (( attempt <= max_attempts )); do\n  attempt_log=\"$RUNNER_TEMP/sarguardian-download-$PRODUCT_ID-attempt-$attempt.log\"\
      \n  echo \"DOWNLOAD_ATTEMPT=$attempt/$max_attempts\"\n  printf 'PRODUCT_MILESTONE=download_started product_id=%s family=%s attempt=%s/%s\\n' \\\n    \"$PRODUCT_ID\"\
      \ \"$PRODUCT_TYPE\" \"$attempt\" \"$max_attempts\"\n  if python tools/download_nisar_product.py \\\n    --product-type \"$PRODUCT_TYPE\" --maturity \"$MATURITY\"\
      \ \\\n    --granule-name \"$GRANULE_NAME\" \\\n    --science-root \"$PWD/science-source\" --aoi \"$AOI_NAME\" \\\n    --expected-source-bytes \"$EXPECTED_SOURCE_BYTES\"\
      \ \\\n    --out-dir \"$RAW_DIR\" 2>&1 | tee \"$attempt_log\"; then\n    cat \"$attempt_log\" >> \"$log\"\n    download_ok=1\n    break\n  else\n    download_status=$?\n\
      \    cat \"$attempt_log\" >> \"$log\"\n  fi\n  if ! grep -q '^DOWNLOAD_FAILURE_RETRYABLE=yes$' \"$attempt_log\"; then\n    echo \"DOWNLOAD_RETRY_STOPPED=non_transient_failure\"\
      \n    break\n  fi\n  if (( attempt >= max_attempts )); then\n    echo \"ERROR=DOWNLOAD_ATTEMPTS_EXHAUSTED attempts=$max_attempts\" | tee -a \"$log\"\n    break\n\
      \  fi\n  delay=$((15 * (2 ** (attempt - 1))))\n  echo \"DOWNLOAD_RETRY_SCHEDULED next_attempt=$((attempt + 1)) sleep_seconds=$delay\"\n  sleep \"$delay\"\n\
      \  attempt=$((attempt + 1))\ndone\nif (( download_ok != 1 )); then\n  exit \"$download_status\"\nfi\nraw_path=\"$(sed -n 's/^RAW_PRODUCT_PATH=//p' \"$log\"\
      \ | tail -n 1)\"\ntest -n \"$raw_path\" && test -f \"$raw_path\"\necho \"raw_path=$raw_path\" >> \"$GITHUB_OUTPUT\"\nprintf 'PRODUCT_MILESTONE=download_completed\
      \ product_id=%s family=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\n"
  - name: Verify retry source bytes match the first attempt
    id: source_identity
    if: inputs.execution_label != 'initial' && steps.download.outcome == 'success'
    env:
      RAW_PATH: ${{ steps.download.outputs.raw_path }}
      PRIOR_ROOT: ${{ runner.temp }}/sarguardian-stream/prior-attempt/granule
    shell: bash
    run: "set -euo pipefail\npython - <<'PY'\nimport json, os\nfrom pathlib import Path\n\nprior_root = Path(os.environ[\"PRIOR_ROOT\"])\nprior_manifest = prior_root\
      \ / \"download-manifest.json\"\nprior_retention = prior_root / \"drive-retention-receipt.json\"\nprior_metadata = prior_root / \"product-processing.json\"\n\
      current_raw = Path(os.environ[\"RAW_PATH\"])\ncurrent_manifest = current_raw.parent / \"download-manifest.json\"\nwith open(os.environ[\"GITHUB_OUTPUT\"], \"\
      a\", encoding=\"utf-8\") as output:\n    output.write(\"same_source=false\\n\")\n\nif not prior_manifest.is_file():\n    if prior_retention.is_file() or prior_metadata.is_file():\n\
      \        raise SystemExit(\n            \"ERROR=RETRY_PRIOR_RETENTION_EXISTS_WITHOUT_SOURCE_MANIFEST\"\n        )\n    print(\"RETRY_SOURCE_IDENTITY=NO_PRIOR_MANIFEST_NO_PRIOR_RETENTION\"\
      )\n    raise SystemExit(0)\n\nif not current_manifest.is_file():\n    raise SystemExit(\"ERROR=RETRY_CURRENT_SOURCE_MANIFEST_MISSING\")\nold = json.loads(prior_manifest.read_text(encoding=\"\
      utf-8\"))\nnew = json.loads(current_manifest.read_text(encoding=\"utf-8\"))\nold_sha = str(old.get(\"source_sha256\", \"\")).lower()\nnew_sha = str(new.get(\"\
      source_sha256\", \"\")).lower()\nif len(old_sha) != 64 or len(new_sha) != 64:\n    raise SystemExit(\"ERROR=RETRY_SOURCE_SHA256_MISSING_OR_INVALID\")\nif old_sha\
      \ != new_sha:\n    print(f\"RETRY_PRIOR_SOURCE_SHA256={old_sha}\")\n    print(f\"RETRY_CURRENT_SOURCE_SHA256={new_sha}\")\n    raise SystemExit(\"ERROR=RETRY_SOURCE_BYTES_CHANGED\"\
      )\nwith open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\") as output:\n    output.write(\"same_source=true\\n\")\nprint(\"RETRY_SOURCE_IDENTITY=PASS_SOURCE_SHA256_MATCH\"\
      )\nPY\n"
  - name: Verify product grid intersects the requested WKT AOI
    id: aoi_preflight
    env:
      RAW_PATH: ${{ steps.download.outputs.raw_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
    shell: bash
    run: "set -euo pipefail\nprintf 'PRODUCT_MILESTONE=aoi_validation_started product_id=%s family=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\npython tools/validate_product_aoi.py\
      \ \\\n  --input \"$RAW_PATH\" --product-type \"$PRODUCT_TYPE\" --aoi \"$AOI_NAME\" \\\n  --science-root \"$PWD/science-source\" --science-commit \"$SCIENCE_COMMIT\"\
      \ \\\n  --out \"$CURATED_DIR/preflight-report.json\"\nprintf 'PRODUCT_MILESTONE=aoi_validation_completed product_id=%s family=%s status=PASS\\n' \\\n  \"$PRODUCT_ID\"\
      \ \"$PRODUCT_TYPE\"\n"
  - name: Inventory source datasets and metadata
    env:
      RAW_PATH: ${{ steps.download.outputs.raw_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
    shell: bash
    run: "set -euo pipefail\npython tools/sarguardian_hdf5_archive.py inventory \\\n  --input \"$RAW_PATH\" --product-type \"$PRODUCT_TYPE\" \\\n  --out \"$CURATED_DIR/source-inventory.json\"\
      \n"
  - name: Create a full-lossless retained HDF5 copy
    id: archive
    if: env.RETENTION_PROFILE == 'full-lossless'
    env:
      RAW_PATH: ${{ steps.download.outputs.raw_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
    shell: bash
    run: "set -euo pipefail\nstem=\"${RAW_PATH##*/}\"\nstem=\"${stem%.*}\"\narchive=\"$CURATED_DIR/archive/${stem}.science.h5\"\nmanifest=\"$CURATED_DIR/${stem}.retention-manifest.json\"\
      \npython tools/sarguardian_hdf5_archive.py archive \\\n  --input \"$RAW_PATH\" --out \"$archive\" --manifest \"$manifest\" \\\n  --product-type \"$PRODUCT_TYPE\"\
      \ --retention-profile full-lossless\ntest -s \"$archive\" && test -s \"$manifest\"\necho \"archive_path=$archive\" >> \"$GITHUB_OUTPUT\"\necho \"manifest_path=$manifest\"\
      \ >> \"$GITHUB_OUTPUT\"\n"
  - name: Compare raw and retained HDF5 via the scientific reader
    id: reader_equivalence
    if: env.RETENTION_PROFILE == 'full-lossless'
    env:
      RAW_PATH: ${{ steps.download.outputs.raw_path }}
      ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
    shell: bash
    run: "set -euo pipefail\npython tools/verify_reader_equivalence.py \\\n  --product-type \"$PRODUCT_TYPE\" --source \"$RAW_PATH\" --archive \"$ARCHIVE_PATH\" \\\
      \n  --science-root \"$PWD/science-source\" --science-commit \"$SCIENCE_COMMIT\" \\\n  --aoi \"$AOI_NAME\" --preflight-report \"$CURATED_DIR/preflight-report.json\"\
      \ \\\n  --out \"$CURATED_DIR/reader-equivalence.json\"\npython - <<'PY'\nimport json, os\nfrom pathlib import Path\nd = json.loads((Path(os.environ[\"CURATED_DIR\"\
      ]) / \"reader-equivalence.json\").read_text(encoding=\"utf-8\"))\nif d.get(\"status\") not in {\"PASS\", \"PASS_NO_VALID_AOI_PIXELS\"}:\n    raise SystemExit(\"\
      ERROR=READER_EQUIVALENCE_NOT_PASSED\")\nprint(f\"READER_EQUIVALENCE_STATUS={d['status']}\")\nPY\n"
  - name: Run the original single-product reader with dynamic WKT-AOI settings
    id: reader
    env:
      RAW_PATH: ${{ steps.download.outputs.raw_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
    shell: bash
    run: "set -euo pipefail\nprintf 'PRODUCT_MILESTONE=science_reader_started product_id=%s family=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\nreader_log=\"$CURATED_DIR/derived/science-reader.log\"\
      \nmkdir -p \"$CURATED_DIR/derived\"\nif [[ \"$PRODUCT_TYPE\" == \"GUNW\" ]]; then\n  stats=\"$CURATED_DIR/derived/gunw_stats_custom.csv\"\n  export_dir=\"$CURATED_DIR/derived/export_custom\"\
      \n  mkdir -p \"$export_dir\"\n  python science-source/src/gunw_reader.py \\\n    --read \"$RAW_PATH\" --aoi \"$AOI_NAME\" --auto-ref --csv \"$stats\" --export\
      \ \"$export_dir\" \\\n    2>&1 | tee \"$reader_log\"\nelse\n  stats=\"$CURATED_DIR/derived/goff_stats_custom.csv\"\n  export_dir=\"$CURATED_DIR/derived/export_goff_custom\"\
      \n  mkdir -p \"$export_dir\"\n  python science-source/src/goff_reader.py \\\n    --read \"$RAW_PATH\" --aoi \"$AOI_NAME\" --layer layer2 --csv \"$stats\" --export\
      \ \"$export_dir\" \\\n    2>&1 | tee \"$reader_log\"\nfi\n\n# No valid AOI pixels is a diagnostic outcome, not a zero-displacement\n# measurement. Create a\
      \ row only when every selected reader layer explicitly\n# emits NO VALID PIXELS; mixed/ambiguous reader failures stay failures.\nif [[ ! -s \"$stats\" ]]; then\n\
      \  python tools/write_no_valid_pixel_stats.py \\\n    --reader-log \"$reader_log\" --stats-csv \"$stats\" \\\n    --raw-product \"$RAW_PATH\" --product-type\
      \ \"$PRODUCT_TYPE\"\nfi\ntest -s \"$stats\"\necho \"stats_path=$stats\" >> \"$GITHUB_OUTPUT\"\n"
  - name: Measure pair-local noise floor at the selected in-AOI target
    id: local_floor
    if: steps.reader.outcome == 'success'
    shell: bash
    env:
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
      PRODUCT_TYPE: ${{ env.PRODUCT_TYPE }}
      TARGET_LATITUDE: ${{ env.TARGET_LATITUDE }}
      TARGET_LONGITUDE: ${{ env.TARGET_LONGITUDE }}
    run: "set -uo pipefail\nroot=\"$CURATED_DIR/derived\"\nmkdir -p \"$root\"\nreport=\"$root/local_floor.json\"\noutput=\"$root/local_floor.csv\"\nexport_dir=\"\
      $root/export_custom\"\nmatch_args=()\nif [[ \"$PRODUCT_TYPE\" == \"GOFF\" ]]; then\n  export_dir=\"$root/export_goff_custom\"\n  match_args=(--match layer2)\n\
      fi\nif [[ -z \"$TARGET_LATITUDE\" || -z \"$TARGET_LONGITUDE\" ]]; then\n  python - \"$report\" <<'PY'\nimport json,sys\nwith open(sys.argv[1],\"w\",encoding=\"\
      utf-8\") as f:\n    json.dump({\"schema_version\":1,\"status\":\"NOT_RUN_NO_IN_AOI_TARGET\",\n               \"reason\":\"No in-AOI target coordinate was supplied;\
      \ no local floor was inferred.\",\n               \"metric_is_motion\":False},f,indent=2)\nPY\n  echo \"LOCAL_FLOOR_STATUS=NOT_RUN_NO_IN_AOI_TARGET\"\n  echo\
      \ \"status=NOT_RUN_NO_IN_AOI_TARGET\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nset +e\npython science-source/src/local_floor.py \\\n  --dir \"$export_dir\" --aoi\
      \ custom --lat \"$TARGET_LATITUDE\" --lon \"$TARGET_LONGITUDE\" \\\n  \"${match_args[@]}\" --band 1 --sweep 3 6 12 --csv \"$output\" \\\n  > \"$root/local_floor.log\"\
      \ 2>&1\nrc=$?\nset -e\nif [[ \"$rc\" == \"0\" && -s \"$output\" ]]; then\n  status=\"PAIRWISE_FLOOR_ROWS_WRITTEN\"\nelse\n  status=\"UNAVAILABLE_NO_MEASURABLE_FLOOR\"\
      \nfi\npython - \"$report\" \"$status\" \"$rc\" \"$TARGET_LATITUDE\" \"$TARGET_LONGITUDE\" \"$output\" <<'PY'\nimport json,os,sys\npath,status,rc,lat,lon,csv_path=sys.argv[1:]\n\
      with open(path,\"w\",encoding=\"utf-8\") as f:\n    json.dump({\"schema_version\":1,\"status\":status,\"exit_code\":int(rc),\n               \"target\":{\"\
      latitude\":float(lat),\"longitude\":float(lon),\"aoi\":\"custom\"},\n               \"csv_path\":os.path.relpath(csv_path,os.path.dirname(path)) if os.path.isfile(csv_path)\
      \ else None,\n               \"metric_is_motion\":False,\n               \"interpretation\":\"Pair-specific spatial noise/detectability estimate around the\
      \ requested point. Not observed displacement, a common stable-ground reference, cumulative motion or a forecast.\"},\n              f,indent=2,sort_keys=True)\n\
      PY\necho \"LOCAL_FLOOR_STATUS=$status\"\necho \"status=$status\" >> \"$GITHUB_OUTPUT\"\n"
  - name: Extract target-local pair measurement from the AOI-clipped raster
    id: target_measurement
    if: steps.reader.outcome == 'success'
    shell: bash
    env:
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
      PRODUCT_TYPE: ${{ env.PRODUCT_TYPE }}
      TARGET_LATITUDE: ${{ env.TARGET_LATITUDE }}
      TARGET_LONGITUDE: ${{ env.TARGET_LONGITUDE }}
    run: "set -uo pipefail\nroot=\"$CURATED_DIR/derived\"\nmkdir -p \"$root\"\nreport=\"$root/target-measurement.json\"\nexport_dir=\"$root/export_custom\"\nif [[\
      \ \"$PRODUCT_TYPE\" == \"GOFF\" ]]; then export_dir=\"$root/export_goff_custom\"; fi\nif [[ -z \"$TARGET_LATITUDE\" || -z \"$TARGET_LONGITUDE\" ]]; then\n \
      \ python - \"$report\" <<'PY'\nimport json,sys\nwith open(sys.argv[1],\"w\",encoding=\"utf-8\") as f:\n    json.dump({\"schema_version\":1,\"status\":\"NOT_RUN_NO_IN_AOI_TARGET\"\
      ,\"measurements\":{},\n               \"interpretation\":\"No in-AOI target was supplied; no target value was inferred.\"},f,indent=2)\nPY\n  echo \"TARGET_MEASUREMENT_STATUS=NOT_RUN_NO_IN_AOI_TARGET\"\
      \n  echo \"status=NOT_RUN_NO_IN_AOI_TARGET\" >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nraster=\"$(find \"$export_dir\" -maxdepth 1 -type f -name '*.tif' | sort |\
      \ head -n 1)\"\nif [[ -z \"$raster\" ]]; then\n  echo '{\"schema_version\":1,\"status\":\"UNAVAILABLE_NO_AOI_RASTER\",\"measurements\":{},\"interpretation\"\
      :\"No validated target raster was available.\"}' > \"$report\"\n  echo \"TARGET_MEASUREMENT_STATUS=UNAVAILABLE_NO_AOI_RASTER\"\n  echo \"status=UNAVAILABLE_NO_AOI_RASTER\"\
      \ >> \"$GITHUB_OUTPUT\"\n  exit 0\nfi\nset +e\npython tools/measure_target_from_raster.py --raster \"$raster\" --product-type \"$PRODUCT_TYPE\" \\\n  --longitude\
      \ \"$TARGET_LONGITUDE\" --latitude \"$TARGET_LATITUDE\" --aoi-wkt \"$SARGUARDIAN_AOI_WKT\" --radius-px 3 \\\n  --minimum-valid-pixels 6 --out \"$report\"\n\
      rc=$?\nset -e\nif [[ ! -s \"$report\" ]]; then\n  python - \"$report\" \"$rc\" <<'PY'\nimport json,sys\nwith open(sys.argv[1],\"w\",encoding=\"utf-8\") as f:\n\
      \    json.dump({\"schema_version\":1,\"status\":\"UNAVAILABLE_MEASUREMENT_ERROR\",\"exit_code\":int(sys.argv[2]),\n               \"measurements\":{},\"interpretation\"\
      :\"Target measurement tool did not produce a report.\"},f,indent=2)\nPY\nfi\nstatus=\"$(python - \"$report\" <<'PY'\nimport json,sys\ntry: print(json.load(open(sys.argv[1],encoding=\"\
      utf-8\")).get(\"status\",\"UNAVAILABLE_MEASUREMENT_ERROR\"))\nexcept Exception: print(\"UNAVAILABLE_MEASUREMENT_ERROR\")\nPY\n)\"\necho \"TARGET_MEASUREMENT_STATUS=$status\"\
      \necho \"status=$status\" >> \"$GITHUB_OUTPUT\"\n"
  - name: Validate derived outputs against the AOI-specific structural checks before cleanup
    id: derived_validation
    env:
      STATS_PATH: ${{ steps.reader.outputs.stats_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
    shell: bash
    run: "set -euo pipefail\nprintf 'PRODUCT_MILESTONE=derived_validation_started product_id=%s family=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\nfamily_lc=\"\
      $(printf '%s' \"$PRODUCT_TYPE\" | tr '[:upper:]' '[:lower:]')\"\nexport_dir=\"$CURATED_DIR/derived/export_custom\"\nif [[ \"$PRODUCT_TYPE\" == \"GOFF\" ]];\
      \ then\n  export_dir=\"$CURATED_DIR/derived/export_goff_custom\"\nfi\npython tools/validate_aoi_derived_outputs.py \\\n  --product-id \"$PRODUCT_ID\" --product-type\
      \ \"$PRODUCT_TYPE\" \\\n  --granule-name \"$GRANULE_NAME\" --aoi-name \"$AOI_NAME\" \\\n  --stats-csv \"$STATS_PATH\" --export-dir \"$export_dir\" \\\n  --out\
      \ \"$CURATED_DIR/derived-output-validation.json\"\nprintf 'PRODUCT_MILESTONE=derived_validation_completed product_id=%s family=%s status=PASS\\n' \\\n  \"$PRODUCT_ID\"\
      \ \"$PRODUCT_TYPE\"\n"
  - name: Build the per-granule processing and retention manifest
    id: metadata
    env:
      ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
      CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
      STATS_PATH: ${{ steps.reader.outputs.stats_path }}
      RAW_DIR: ${{ steps.paths.outputs.raw_dir }}
      RETENTION_PROFILE: ${{ env.RETENTION_PROFILE }}
    shell: bash
    run: "set -euo pipefail\ncp \"$RAW_DIR/download-manifest.json\" \"$CURATED_DIR/download-manifest.json\"\npython - <<'PY'\nimport csv, hashlib, json, os\nfrom\
      \ pathlib import Path\nroot = Path(os.environ[\"CURATED_DIR\"]).resolve()\narchive_text = os.environ.get(\"ARCHIVE_PATH\", \"\").strip()\narchive = Path(archive_text).resolve()\
      \ if archive_text else None\nstats = Path(os.environ[\"STATS_PATH\"]).resolve()\nprofile = os.environ[\"RETENTION_PROFILE\"]\nwith stats.open(newline=\"\",\
      \ encoding=\"utf-8-sig\") as f:\n    reader = csv.DictReader(f); rows = list(reader); fields = reader.fieldnames or []\ndef canonical_granule_name(value):\n\
      \    name = Path(str(value or \"\").strip()).name\n    return name[:-3] if name.lower().endswith(\".h5\") else name\nexpected = canonical_granule_name(os.environ[\"\
      GRANULE_NAME\"])\nif not rows or \"file\" not in fields or any(canonical_granule_name(r.get(\"file\")) != expected for r in rows):\n    raise SystemExit(\"\
      ERROR=READER_OUTPUT_EMPTY_OR_WRONG_GRANULE\")\nif os.environ[\"PRODUCT_TYPE\"] == \"GUNW\" and len(rows) != 1:\n    raise SystemExit(\"ERROR=GUNW_EXPECTED_ONE_ROW\"\
      )\nif os.environ[\"PRODUCT_TYPE\"] == \"GOFF\" and (len(rows) != 1 or \"layer2\" not in rows[0].get(\"layer\", \"\").lower()):\n    raise SystemExit(\"ERROR=GOFF_EXPECTED_ONE_LAYER2_ROW\"\
      )\nvalidation = json.loads((root / \"derived-output-validation.json\").read_text(encoding=\"utf-8\"))\nif validation.get(\"status\") != \"PASS\":\n    raise\
      \ SystemExit(\"ERROR=DERIVED_OUTPUT_VALIDATION_NOT_PASSED\")\neq_path = root / \"reader-equivalence.json\"\neq = json.loads(eq_path.read_text(encoding=\"utf-8\"\
      )) if eq_path.is_file() else None\nif profile == \"full-lossless\":\n    if archive is None or not archive.is_file() or eq is None or eq.get(\"status\") not\
      \ in {\"PASS\", \"PASS_NO_VALID_AOI_PIXELS\"}:\n        raise SystemExit(\"ERROR=FULL_LOSSLESS_REQUIREMENTS_NOT_MET\")\nelif profile == \"derived-only\" and\
