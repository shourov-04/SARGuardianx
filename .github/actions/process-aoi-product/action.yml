      \ \"${cleanup_retry_flags[@]}\" \\\n  --root \"$CURATED_DIR\" --product-type \"$PRODUCT_TYPE\" --maturity \"$MATURITY\" \\\n  --granule-name \"$GRANULE_NAME\"\
      \ --version-tag \"$DRIVE_VERSION_TAG\" \\\n  --job-id \"$DRIVE_JOB_ID\" \\\n  --files \"$CURATED_DIR/local-cleanup-receipt.json\" \\\n  --out \"$CURATED_DIR/drive-cleanup-upload-receipt.json\"\
      \npython - <<'PY'\nimport json, os\nfrom pathlib import Path\nroot=Path(os.environ[\"CURATED_DIR\"])\nreceipt=json.loads((root/\"drive-cleanup-upload-receipt.json\"\
