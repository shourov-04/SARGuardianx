    shell: bash
    run: "set -euo pipefail\nprintf 'PRODUCT_MILESTONE=cleanup_started product_id=%s family=%s\\n' \\\n  \"$PRODUCT_ID\" \"$PRODUCT_TYPE\"\npython - <<'PY'\nimport\
      \ json, os\nfrom pathlib import Path\nroot=Path(os.environ[\"CURATED_DIR\"])\nmeta=json.loads((root/\"product-processing.json\").read_text(encoding=\"utf-8\"\
      ))\nretention=json.loads((root/\"drive-retention-receipt.json\").read_text(encoding=\"utf-8\"))\nvalidation=json.loads((root/\"derived-output-validation.json\"\
