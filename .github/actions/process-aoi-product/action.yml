        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/derived-output-validation.json

        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/source-inventory.json

        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/preflight-report.json

        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/download-manifest.json

        ${{ runner.temp }}/sarguardian-stream/${{ inputs.product_id }}/curated/*retention-manifest.json

