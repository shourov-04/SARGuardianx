      : profile,\n    \"source_file_sha256\": download[\"source_sha256\"], \"source_file_bytes\": download[\"source_bytes\"],\n    \"retained_archive\": archive.relative_to(root).as_posix()\
      \ if archive else None,\n    \"retained_archive_sha256\": sha256(archive) if archive else None,\n    \"stats_csv\": stats.relative_to(root).as_posix(), \"stats_rows\"\
      : len(rows),\n    \"export_dir\": export_dir.relative_to(root).as_posix(), \"export_files\": exports,\n    \"derived_output_validation_status\": validation[\"\
      status\"],\n    \"derived_output_validation\": \"derived-output-validation.json\",\n    \"reader_equivalence_status\": eq[\"status\"] if eq else \"NOT_RUN_DERIVED_ONLY\"\
