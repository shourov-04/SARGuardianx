      )\nprint(\"REMOTE_DERIVED_OUTPUTS_AND_RETENTION_POLICY_VERIFIED=PASS\")\nPY\nrm -f -- \"$RAW_PATH\"\ntest ! -e \"$RAW_PATH\"\narchive_path=\"${ARCHIVE_PATH:-}\"\
      \nif [[ -n \"$archive_path\" ]]; then\n  test -f \"$archive_path\"\n  rm -f -- \"$archive_path\"\n  test ! -e \"$archive_path\"\nfi\npython - <<'PY'\nimport\
      \ json, os\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nroot=Path(os.environ[\"CURATED_DIR\"])\nmeta=json.loads((root/\"product-processing.json\"\
      ).read_text(encoding=\"utf-8\"))\ndownload=json.loads((root/\"download-manifest.json\").read_text(encoding=\"utf-8\"))\nretention=json.loads((root/\"drive-retention-receipt.json\"\
      ).read_text(encoding=\"utf-8\"))\nraw_exists=Path(os.environ[\"RAW_PATH\"]).exists()\narchive_path=os.environ.get(\"ARCHIVE_PATH\",\"\").strip()\narchive_exists=Path(archive_path).exists()\
      \ if archive_path else False\nif raw_exists or archive_exists or retention.get(\"remote_verification\")!=\"PASS\":\n    raise SystemExit(\"ERROR=LOCAL_CLEANUP_RECEIPT_GATE_FAILED\"\
      )\narchive_files=[r for r in retention.get(\"files\",[]) if str(r.get(\"name\",\"\")).endswith(\".science.h5\")]\nif meta[\"retention_profile\"]==\"full-lossless\"\
      \ and len(archive_files)!=1:\n    raise SystemExit(\"ERROR=FULL_LOSSLESS_ARCHIVE_RECEIPT_MISSING\")\nif meta[\"retention_profile\"]==\"derived-only\" and archive_files:\n\
      \    raise SystemExit(\"ERROR=DERIVED_ONLY_ARCHIVE_MUST_NOT_BE_RETAINED\")\nrecord={\n    \"schema_version\":\"sarguardian-local-cleanup-receipt/1.1\",\n  \
      \  \"created_utc\":datetime.now(timezone.utc).isoformat(),\n    \"product_id\":os.environ[\"PRODUCT_ID\"], \"product_type\":os.environ[\"PRODUCT_TYPE\"],\n\
      \    \"maturity\":os.environ[\"MATURITY\"], \"granule_name\":os.environ[\"GRANULE_NAME\"],\n    \"aoi\":os.environ[\"AOI_NAME\"], \"science_commit\":os.environ[\"\
