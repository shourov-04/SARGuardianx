      rb\") as f:\n        for block in iter(lambda: f.read(8*1024*1024), b\"\"):\n            h.update(block)\n    return h.hexdigest()\nexport_dir = root / \"derived\"\
      \ / (\"export_custom\" if os.environ[\"PRODUCT_TYPE\"] == \"GUNW\" else \"export_goff_custom\")\nexports = [p.relative_to(root).as_posix() for p in sorted(export_dir.rglob(\"\
      *\")) if p.is_file() and p.suffix.lower() in {\".tif\", \".tiff\"}]\nif not exports:\n    raise SystemExit(\"ERROR=READER_DID_NOT_EXPORT_ANY_GEOTIFF\")\nmetadata\
      \ = {\n    \"schema_version\": \"sarguardian-stream-product/1.1\",\n    \"id\": os.environ[\"PRODUCT_ID\"], \"product_type\": os.environ[\"PRODUCT_TYPE\"],\n\
      \    \"maturity\": os.environ[\"MATURITY\"], \"granule_name\": expected, \"aoi\": os.environ[\"AOI_NAME\"],\n    \"science_commit\": os.environ[\"SCIENCE_COMMIT\"\
