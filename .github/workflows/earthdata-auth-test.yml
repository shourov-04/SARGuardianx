name: Earthdata credential authentication diagnostic
run-name: Earthdata username/password authentication diagnostic

# Manual-only credential verification; no catalogue query or product download.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-earthdata-auth-diagnostic
  cancel-in-progress: false

jobs:
  preflight:
    name: Require explicit Earthdata diagnostics opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before credential use
        env:
          MONOREPO_EARTHDATA_DIAGNOSTICS_ENABLED: ${{ vars.MONOREPO_EARTHDATA_DIAGNOSTICS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MONOREPO_EARTHDATA_DIAGNOSTICS_ENABLED" != "true" ]]; then
            echo "::error::Earthdata credential diagnostics are disabled."
            exit 1
          fi
          echo "MONOREPO_EARTHDATA_DIAGNOSTICS_GATE=PASS"

  authenticate:
    name: Authenticate earthaccess from environment
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install Earthdata client
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 earthaccess

      - name: Authenticate without catalogue or data access
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EARTHDATA_USERNAME" || -z "$EARTHDATA_PASSWORD" ]]; then
            echo "::error::EARTHDATA_USERNAME or EARTHDATA_PASSWORD is missing."
            exit 1
          fi
          python - <<'PY'
          import sys
          import earthaccess
          try:
              auth = earthaccess.login(strategy="environment")
              if not auth:
                  raise RuntimeError("earthaccess returned an empty authentication result")
          except Exception as exc:
              print("EARTHDATA_AUTH_FAILED")
              print(f"AUTH_EXCEPTION_TYPE={type(exc).__name__}")
              sys.exit(1)
          print("EARTHDATA_AUTH_SUCCESS")
          PY

      - name: Summarize credential-only test scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Earthdata credential authentication diagnostic"
            echo "- Login method: earthaccess environment credentials"
            echo "- Catalogue search: not performed"
            echo "- NISAR product download: not performed"
            echo "- Google Drive upload: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
