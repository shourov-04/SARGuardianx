name: SARGuardian Backend Source Snapshot Regression Tests

on:
  push:
    branches:
      - "migration/source-snapshot-import"
    paths:
      - "migration/source-snapshots/backend-main/**"
      - "migration/source-snapshots/backend-known-place-pr85/**"
      - ".github/workflows/backend-source-regression-tests.yml"
  pull_request:
    paths:
      - "migration/source-snapshots/backend-main/**"
      - "migration/source-snapshots/backend-known-place-pr85/**"
      - ".github/workflows/backend-source-regression-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-source-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot-regression:
    name: Full ${{ matrix.label }} source test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - label: Backend main
            snapshot_path: migration/source-snapshots/backend-main
          - label: Known Place PR #85
            snapshot_path: migration/source-snapshots/backend-known-place-pr85

    steps:
      - name: Checkout immutable source snapshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.snapshot_path }}/requirements-dev.txt
            ${{ matrix.snapshot_path }}/tools/requirements-retention.txt
            ${{ matrix.snapshot_path }}/tools/know_place/requirements.txt

      - name: Install immutable source test dependencies
        shell: bash
        run: |
          set -euo pipefail
          source_root="${{ matrix.snapshot_path }}"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r "$source_root/requirements-dev.txt"
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r "$source_root/tools/requirements-retention.txt"

          if [[ -f "$source_root/tools/know_place/requirements.txt" ]]; then
            python -m pip install --disable-pip-version-check --no-cache-dir \
              -r "$source_root/tools/know_place/requirements.txt" pillow matplotlib
            echo "BACKEND_SOURCE_TEST_PROFILE=known-place-pr85"
          else
            python -m pip install --disable-pip-version-check --no-cache-dir \
              rasterio matplotlib pillow pyproj
            echo "BACKEND_SOURCE_TEST_PROFILE=backend-main"
          fi

      - name: Compile all source tools and tests
        working-directory: ${{ matrix.snapshot_path }}
        run: python -m compileall -q tools tests

      - name: Run complete source repository regression suite
        working-directory: ${{ matrix.snapshot_path }}
        run: python -m pytest -q

      - name: Validate retained workflow YAML from the exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="${{ matrix.snapshot_path }}" python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          root = Path(os.environ["SOURCE_ROOT"])
          names = (
              "sarguardian-retention-pilot.yml",
              "sarguardian-product-worker.yml",
              "sarguardian-streaming-batch.yml",
              "sarguardian-reassemble-existing.yml",
              "sarguardian-live-validation.yml",
              "sarguardian-retention-ci.yml",
          )
          if (root / "tools/know_place").is_dir():
              names = names + ("know-place-aoi-analysis.yml", "know-place-author-exact-replay.yml")
          for name in names:
              path = root / ".github" / "workflows" / name
              if not path.is_file():
                  raise SystemExit(f"Missing required source workflow: {path}")
              document = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(document, dict) or not isinstance(document.get("jobs"), dict):
                  raise SystemExit(f"Invalid workflow job map: {path}")
              print(f"BACKEND_SOURCE_WORKFLOW_YAML=PASS FILE={path}")
          PY

