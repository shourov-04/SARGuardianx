name: RiverShift retained-run OPERA DSWx-S1 SAR cross-check (Monorepo)
run-name: RiverShift OPERA DSWx-S1 · Monorepo run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Monorepo RiverShift GCOV run containing retained artifacts
        required: true
        type: string
      source_job_id:
        description: Job UUID used to name the rivershift-prepared artifact
        required: true
        type: string
      api_base_url:
        description: Monorepo Preview API only
        required: true
        type: string
        default: "https://sar-guardi-git-ed4bd9-moshiour-rahman-sarkers-projects-2cebe363.vercel.app"
      maximum_date_offset_days:
        description: Strict maximum sensing-date offset allowed for a validation score
        required: true
        type: choice
        options: ["0", "1", "2", "3", "5", "7"]
        default: "3"
      discovery_window_days:
        description: Discovery window; outside strict scoring window remains NO_SCORE
        required: true
        type: choice
        options: ["3", "7", "14", "21", "30"]
        default: "30"
      minimum_common_support_fraction:
        description: Minimum labelled OPERA WTR support over NISAR-valid pixels
        required: true
        type: choice
        options: ["0.80", "0.85", "0.90", "0.95", "0.99"]
        default: "0.80"

permissions:
  actions: read
  contents: read

concurrency:
  group: monorepo-rivershift-opera-${{ inputs.source_run_id }}-${{ inputs.source_job_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require OPERA retained-reference replay opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before API, Earthdata or Drive access
        env:
          ENABLED: ${{ vars.MONOREPO_RIVERSHIFT_OPERA_REPLAY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::RiverShift OPERA retained-reference replay is disabled."
            exit 1
          fi
          echo "MONOREPO_RIVERSHIFT_OPERA_REPLAY_GATE=PASS"

  reference:
    name: Build OPERA DSWx-S1 cross-sensor reference from retained NISAR result
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_JOB_ID: ${{ inputs.source_job_id }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - name: Check out full Monorepo history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful same-branch Monorepo GCOV source run and retained prepared artifact
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python engines/river-shift/tools/river_shift/verify_monorepo_source_run.py             --source-run-id "$SOURCE_RUN_ID"             --source-job-id "$SOURCE_JOB_ID"             --expected-branch "$EXPECTED_BRANCH"             --output "$RUNNER_TEMP/rivershift-source-run-verification.json"

      - name: Verify the API URL is the Monorepo Preview API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          expected = "sar-guardi-git-ed4bd9-moshiour-rahman-sarkers-projects-2cebe363.vercel.app"
          parsed = urlsplit(os.environ["API_BASE_URL"])
          if parsed.scheme != "https" or parsed.hostname != expected or parsed.username or parsed.password:
              raise SystemExit("API_BASE_URL_MUST_BE_THE_MONOREPO_PREVIEW_API")
          print("RIVERSHIFT_API_TARGET=MONOREPO_PREVIEW")
          PY

      - name: Download exact retained prepared manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rivershift-prepared-${{ inputs.source_job_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: prepared

      - name: Verify downloaded prepared manifest belongs to requested source job
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          matches = list(Path("prepared").rglob("prepared.json"))
          if len(matches) != 1:
              raise SystemExit("EXPECTED_EXACTLY_ONE_PREPARED_MANIFEST")
          prepared = json.loads(matches[0].read_text(encoding="utf-8"))
          if prepared.get("job_id") != os.environ["SOURCE_JOB_ID"]:
              raise SystemExit("PREPARED_MANIFEST_JOB_ID_MISMATCH")
          names = prepared.get("selected_product_names")
          if not isinstance(names, list) or not names:
              raise SystemExit("PREPARED_MANIFEST_HAS_NO_SELECTED_PRODUCTS")
          print(f"RIVERSHIFT_PREPARED_MANIFEST=PASS selected_products={len(names)}")
          PY

      - name: Install pinned RiverShift geospatial runtime
        uses: mamba-org/setup-micromamba@f45730a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-file: engines/river-shift/tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true

      - name: Run OPERA DSWx-S1 independent SAR cross-check
        id: replay
        shell: micromamba-shell {0}
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          RIVERSHIFT_CALLBACK_SECRET: ${{ secrets.RIVERSHIFT_CALLBACK_SECRET }}
          GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          MAXIMUM_DATE_OFFSET_DAYS: ${{ inputs.maximum_date_offset_days }}
          DISCOVERY_WINDOW_DAYS: ${{ inputs.discovery_window_days }}
          MINIMUM_COMMON_SUPPORT_FRACTION: ${{ inputs.minimum_common_support_fraction }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python --version
          gdalinfo --version
          python -c "import earthaccess, rasterio, numpy, shapely, pyproj; print('RIVERSHIFT_OPERA_RUNTIME=PASS')"
          python -u engines/river-shift/tools/river_shift/run_opera_dswx_s1_reference.py             --prepared-dir prepared             --api-base-url "$API_BASE_URL"             --output-dir opera-output             --maximum-date-offset-days "$MAXIMUM_DATE_OFFSET_DAYS"             --discovery-window-days "$DISCOVERY_WINDOW_DAYS"             --minimum-common-support-fraction "$MINIMUM_COMMON_SUPPORT_FRACTION"             --block-size-pixels 64             --bootstrap-replicates 500

      - name: Retain OPERA reference and independent comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: river-shift-opera-dswx-s1-reference-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            opera-output/opera_dswx_s1_reference_report.json
            opera-output/opera_dswx_s1_independent_validation.json
            opera-output/opera_dswx_s1_validation_status.json
            opera-output/reference-opera-dswx-s1-water.tif
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Publish privacy-safe scientific outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          status_path = Path("opera-output/opera_dswx_s1_validation_status.json")
          report_path = Path("opera-output/opera_dswx_s1_reference_report.json")
          print("## RiverShift — OPERA DSWx-S1 SAR cross-sensor reference")
          print()
          if not status_path.is_file() or not report_path.is_file():
              print("Pipeline did not produce a complete scientific report; review preceding logs.")
              raise SystemExit(0)
          status = json.loads(status_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(f"- Status: **{status.get('status')}**")
          print(f"- Source job: {status.get('source_job_id')}")
          print(f"- NISAR observation: {status.get('requested_nisar_observation_date')}")
          print(f"- OPERA observation: {status.get('selected_opera_observation_date') or 'no eligible scene'}")
          print(f"- Common valid support: {status.get('common_support_fraction') if status.get('common_support_fraction') is not None else 'not calculated'}")
          print(f"- Release status: **{status.get('release_status', 'PROVISIONAL')}**")
          print(f"- Independent review required: {status.get('review_required', True)}")
          metrics = ((report.get("validation") or {}).get("metrics") or {})
          print()
          if metrics:
              print("| Metric | Value |")
              print("|---|---:|")
              for key in ("accuracy", "precision_user_accuracy", "recall_producer_accuracy", "f1_score", "intersection_over_union", "specificity", "cohen_kappa", "area_bias_percent"):
                  value = metrics.get(key)
                  print(f"| {key} | {'not available' if value is None else f'{float(value):.4f}'} |")
          else:
              print("No accuracy metrics were calculated or published.")
          print()
          print("**Interpretation:** OPERA DSWx-S1 is a Sentinel-1 C-band SAR-derived open-water cross-check, not field truth. It does not validate erosion, deposition, bankline migration, sediment volume or flood causality. The original NISAR job remains PROVISIONAL.")
          PY

      - name: Enforce independent-reference metrics gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f opera-output/opera_dswx_s1_validation_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("opera-output/opera_dswx_s1_validation_status.json").read_text(encoding="utf-8"))
          status = payload.get("status")
          print(f"RIVERSHIFT_OPERA_FINAL_STATUS={status}")
          if status != "METRICS_COMPUTED_REVIEW_REQUIRED":
              raise SystemExit("NO_ELIGIBLE_OPERA_METRICS_OR_REVIEW_GATE_FAILED")
          print("RIVERSHIFT_OPERA_METRICS_GATE=PASS")
          print("RIVERSHIFT_OPERA_RELEASE_STATUS=PROVISIONAL_REVIEW_REQUIRED")
          PY
