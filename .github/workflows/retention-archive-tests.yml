name: Retention Archive Regression Tests (Monorepo source snapshot)

on:
  push:
    branches:
      - "migration/source-snapshot-import"
    paths:
      - "migration/source-snapshots/backend-main/tools/**"
      - "migration/source-snapshots/backend-main/tests/**"
      - "migration/source-snapshots/backend-main/.github/workflows/retention-archive-tests.yml"
      - ".github/workflows/retention-archive-tests.yml"
      - "engines/find-displacements/tools/**"
  pull_request:
    paths:
      - "migration/source-snapshots/backend-main/tools/**"
      - "migration/source-snapshots/backend-main/tests/**"
      - "migration/source-snapshots/backend-main/.github/workflows/retention-archive-tests.yml"
      - ".github/workflows/retention-archive-tests.yml"
      - "engines/find-displacements/tools/**"

permissions:
  contents: read

concurrency:
  group: monorepo-retention-archive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hdf5-retention-regression:
    name: Isolated historical HDF5/archive regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout Monorepo snapshots and promoted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: migration/source-snapshots/backend-main/tools/requirements-retention.txt

      - name: Install retention test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir \
            -r migration/source-snapshots/backend-main/tools/requirements-retention.txt \
            pytest PyYAML

      - name: Run source-pinned archive and pipeline fixture tests
        shell: bash
        run: |
          set -euo pipefail
          source_root="migration/source-snapshots/backend-main"
          fixture_root="$RUNNER_TEMP/retention-regression"
          mkdir -p "$fixture_root/tools" "$fixture_root/tests"

          cp "$source_root/tools/sarguardian_hdf5_archive.py" \
            "$source_root/tools/download_nisar_product.py" \
            "$source_root/tools/drive_resumable_upload.py" \
            "$source_root/tools/verify_reader_equivalence.py" \
            "$source_root/tools/validate_product_aoi.py" \
            "$source_root/tools/time_window.py" \
            "$source_root/tools/aggregate_streamed_outputs.py" \
            "$source_root/tools/run_pinned_science_suite.py" \
            "$fixture_root/tools/"

          cp "$source_root/tests/test_hdf5_archive.py" \
            "$source_root/tests/test_pipeline_helpers.py" \
            "$source_root/tests/test_time_window.py" \
            "$source_root/tests/test_aggregate_streamed_outputs.py" \
            "$fixture_root/tests/"

          PYTHONPATH="$fixture_root" python -m pytest -q \
            "$fixture_root/tests" --confcutdir="$fixture_root"

      - name: Validate historical and promoted retention workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = (
              Path("migration/source-snapshots/backend-main/.github/workflows/retention-archive-tests.yml"),
              Path("migration/source-snapshots/backend-main/.github/workflows/sarguardian-retention-pilot.yml"),
              Path("migration/source-snapshots/backend-main/.github/workflows/sarguardian-live-validation.yml"),
              Path("migration/source-snapshots/backend-main/.github/workflows/sarguardian-streaming-batch.yml"),
              Path("migration/source-snapshots/backend-main/.github/workflows/sarguardian-reassemble-existing.yml"),
              Path(".github/workflows/retention-archive-tests.yml"),
              Path(".github/workflows/find-displacements-retention-pilot.yml"),
              Path(".github/workflows/find-displacements-reassemble-existing.yml"),
              Path(".github/workflows/sarguardian-streaming-batch.yml"),
          )
          for path in paths:
              document = yaml.safe_load(path.read_text(encoding="utf-8"))
              if not isinstance(document, dict) or not isinstance(document.get("jobs"), dict):
                  raise SystemExit(f"Invalid workflow job map: {path}")
              print(f"RETENTION_WORKFLOW_YAML=PASS FILE={path}")
          PY
