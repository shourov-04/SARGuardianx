name: Earthdata token probe-only diagnostic
run-name: Earthdata NISAR token probe-only diagnostic

# Manual-only token probe. --probe-only must not create a raw product directory.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-earthdata-token-diagnostic
  cancel-in-progress: false

jobs:
  preflight:
    name: Require explicit Earthdata diagnostics opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before token use
        env:
          MONOREPO_EARTHDATA_DIAGNOSTICS_ENABLED: ${{ vars.MONOREPO_EARTHDATA_DIAGNOSTICS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MONOREPO_EARTHDATA_DIAGNOSTICS_ENABLED" != "true" ]]; then
            echo "::error::Earthdata token diagnostics are disabled."
            exit 1
          fi
          echo "MONOREPO_EARTHDATA_DIAGNOSTICS_GATE=PASS"

  probe:
    name: Probe one known-good NISAR catalogue/auth route without download
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engines/find-displacements
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      SCIENCE_COMMIT: ab547ecc82bcc4d6ccef545a59852536c2beacc6
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out full Monorepo history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract exact source acquisition pin
        shell: bash
        run: |
          set -euo pipefail
          science_root="$RUNNER_TEMP/earthdata-science"
          mkdir -p "$science_root"
          git -C "$GITHUB_WORKSPACE" cat-file -e "$SCIENCE_COMMIT^{commit}"
          git -C "$GITHUB_WORKSPACE" archive "$SCIENCE_COMMIT" | tar -x -C "$science_root"
          test -s "$science_root/requirements.txt"
          test -s "$science_root/src/gunw_reader.py"
          echo "EARTHDATA_SCIENCE_PIN=PASS"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install pinned science and retention dependencies
        shell: bash
        env:
          SCIENCE_ROOT: ${{ runner.temp }}/earthdata-science
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r "$SCIENCE_ROOT/requirements.txt"
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r requirements-retention.txt

      - name: Require token and probe one known-good GUNW without downloading
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EARTHDATA_TOKEN" ]]; then
            echo "::error::EARTHDATA_TOKEN is missing."
            exit 1
          fi
          raw_dir="$RUNNER_TEMP/earthdata-token-probe-no-download"
          test ! -e "$raw_dir"
          python -u tools/download_nisar_product.py \
            --product-type GUNW \
            --maturity PROVISIONAL \
            --granule-name "NISAR_L2_PR_GUNW_026_048_D_074_028_4000_SH_20260723T125813_20260723T125848_20260816T125812_20260816T125846_P05023_N_F_J_001" \
            --science-root "$RUNNER_TEMP/earthdata-science" \
            --aoi source \
            --out-dir "$raw_dir" \
            --probe-only
          test ! -e "$raw_dir"
          echo "RAW_DOWNLOAD_PERFORMED=no"
          echo "GOOGLE_DRIVE_UPLOAD_PERFORMED=no"

      - name: Summarize probe-only test
        if: always()
        shell: bash
        run: |
          {
            echo "## Earthdata token probe-only diagnostic"
            echo "- Exact science source pin: ab547ecc82bcc4d6ccef545a59852536c2beacc6"
            echo "- NISAR request: known-good GUNW probe only"
            echo "- Raw HDF5 download: prohibited by --probe-only and checked absent"
            echo "- Google Drive upload: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
