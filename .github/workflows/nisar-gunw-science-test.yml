name: NISAR GUNW Science Feasibility Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monorepo-nisar-gunw-product-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require explicit GUNW science feasibility opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before Earthdata download
        env:
          MONOREPO_NISAR_PRODUCT_TESTS_ENABLED: ${{ vars.MONOREPO_NISAR_PRODUCT_TESTS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MONOREPO_NISAR_PRODUCT_TESTS_ENABLED" != "true" ]]; then
            echo "::error::NISAR product feasibility tests are disabled. Enable only for an approved Preview one-granule read test."
            exit 1
          fi
          echo "MONOREPO_NISAR_PRODUCT_TEST_GATE=PASS"

  gunw-science-test:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Check out full Monorepo history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract exact historical science source from Monorepo Git history
        shell: bash
        env:
          SCIENCE_COMMIT: 77cc9646cfa46d3aff3669d351912f984cf67aa3
        run: |
          set -euo pipefail
          mkdir -p science-source
          git -C "$GITHUB_WORKSPACE" cat-file -e "$SCIENCE_COMMIT^{commit}"
          git -C "$GITHUB_WORKSPACE" archive "$SCIENCE_COMMIT" | tar -x -C science-source
          test -s science-source/src/gunw_reader.py
          test -s science-source/requirements.txt
          echo "NISAR_LEGACY_SCIENCE_PIN=PASS"

      - name: Install pinned scientific dependencies
        run: python -m pip install --requirement science-source/requirements.txt

      - name: Download and read one GUNW granule
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          SCIENCE_COMMIT: 77cc9646cfa46d3aff3669d351912f984cf67aa3
        run: |
          set -euo pipefail
          SCIENCE_ROOT="$PWD/science-source" python - <<'PY'
          import contextlib
          import gc
          import io
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import threading
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from time import monotonic

          EXPECTED_COMMIT = "77cc9646cfa46d3aff3669d351912f984cf67aa3"
          SCIENCE_REPOSITORY = "Sagormodak/SARGuardian"
          science_root = Path(os.environ["SCIENCE_ROOT"])
          raw_dir = Path(tempfile.mkdtemp(prefix="nisar-gunw-science-"))
          summary_path = Path(tempfile.gettempdir()) / "nisar-gunw-science-summary.json"
          raw_path = None
          exit_code = 0
          failure_marker = None
          cleanup_succeeded = False
          test_started_at = datetime.now(timezone.utc)
          test_start = monotonic()

          def timestamp():
              return datetime.now(timezone.utc).isoformat()

          def disk_snapshot(label):
              usage = shutil.disk_usage("/")
              print(f"DISK_{label}_AVAILABLE_BYTES: {usage.free}")
              subprocess.run(["df", "-h", "/"], check=False)
              return usage

          def process_rss_bytes():
              try:
                  for line in Path("/proc/self/status").read_text().splitlines():
                      if line.startswith("VmRSS:"):
                          return int(line.split()[1]) * 1024
              except (OSError, ValueError, IndexError):
                  pass
              return None

          def safe_name(row):
              name = row.get("granuleName") or row.get("productType") or "unknown"
              return Path(str(name).split("?", 1)[0].split("#", 1)[0]).name

          def science_rss_monitor(stop_event, peak):
              while not stop_event.is_set():
                  rss = process_rss_bytes()
                  if rss is not None:
                      peak[0] = max(peak[0], rss)
                  stop_event.wait(0.05)

          try:
              sys.path.insert(0, str(science_root / "src"))
              import asf_search
              import nisar_acquisition as acquisition
              from gunw_reader import read_gunw, report, set_aoi

              expected = EXPECTED_COMMIT
              actual = os.environ.get("SCIENCE_COMMIT", "")
              if actual != expected:
                  raise RuntimeError("science source revision mismatch")

              phase = "discovery"
              try:
                  acquisition.set_aoi("source")
                  discovery_end = datetime.now(timezone.utc).date().isoformat()
                  rows = None
                  for attempt in range(3):
                      try:
                          rows = acquisition.query_by_year(
                              "2026-06-17",
                              discovery_end,
                              platform="NISAR",
                              processingLevel="GUNW",
                              maxResults=25,
                          )
                          break
                      except Exception:
                          if attempt == 2:
                              raise
                          time.sleep(5 * (2 ** attempt))
                  candidates = sorted(
                      (
                          row for row in rows
                          if row.get("productType") == "GUNW"
                          and row.get("downloadUrl")
                      ),
                      key=lambda row: row.get("granuleName", ""),
                  )
                  if not candidates:
                      raise RuntimeError("no downloadable GUNW result")
                  selected = candidates[0]
                  product_name = safe_name(selected)
                  print(f"GUNW_PRODUCT: {product_name}")
              except Exception:
                  failure_marker = "NISAR_GUNW_DISCOVERY_FAILED"
                  raise

              before_download = disk_snapshot("BEFORE_DOWNLOAD")
              download_started_at = timestamp()
              download_start = monotonic()
              phase = "download"
              try:
                  session = acquisition.build_session()
                  with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                      asf_search.download_url(
                          url=selected["downloadUrl"],
                          path=str(raw_dir),
                          session=session,
                      )
                  downloaded_files = sorted(raw_dir.rglob("*.h5"))
                  if len(downloaded_files) != 1:
                      raise RuntimeError("download did not produce exactly one HDF5 file")
                  raw_path = downloaded_files[0]
              except Exception:
                  failure_marker = "NISAR_GUNW_DOWNLOAD_FAILED"
                  raise
              download_finished_at = timestamp()
              download_elapsed = monotonic() - download_start
              after_download = disk_snapshot("AFTER_DOWNLOAD")
              print(f"GUNW_DOWNLOAD_START_UTC: {download_started_at}")
              print(f"GUNW_DOWNLOAD_END_UTC: {download_finished_at}")
              print(f"GUNW_FILE_SIZE_BYTES: {raw_path.stat().st_size}")
              print(f"GUNW_DOWNLOAD_ELAPSED_SECONDS: {download_elapsed:.3f}")

              phase = "science"
              science_started_at = timestamp()
              science_start = monotonic()
              rss_before = process_rss_bytes()
              peak_rss = [rss_before or 0]
              monitor_stop = threading.Event()
              monitor = threading.Thread(
                  target=science_rss_monitor,
                  args=(monitor_stop, peak_rss),
                  daemon=True,
              )
              monitor.start()
              try:
                  set_aoi("source")
                  result = read_gunw(raw_path, clip_aoi=True, auto_ref=True)
                  valid_pixels = int(result["valid"].sum())
                  if valid_pixels < 1:
                      raise RuntimeError("no valid pixels extracted from GUNW")
                  report_output = io.StringIO()
                  with contextlib.redirect_stdout(report_output):
                      report_result = report(result)
              except Exception:
                  failure_marker = "NISAR_GUNW_SCIENCE_FAILED"
                  raise
              finally:
                  monitor_stop.set()
                  monitor.join(timeout=2)
              rss_after = process_rss_bytes()
              science_finished_at = timestamp()
              science_elapsed = monotonic() - science_start
              summary = {
                  "test_type": "real GUNW reader science feasibility",
                  "science_repository": SCIENCE_REPOSITORY,
                  "science_commit": EXPECTED_COMMIT,
                  "product_type": "GUNW",
                  "product_identifier": product_name,
                  "downloaded_file_size_bytes": raw_path.stat().st_size,
                  "valid_pixel_count": valid_pixels,
                  "report_output": report_output.getvalue(),
                  "report_result": report_result,
                  "test_started_utc": test_started_at.isoformat(),
                  "download_started_utc": download_started_at,
                  "download_finished_utc": download_finished_at,
                  "science_started_utc": science_started_at,
                  "science_finished_utc": science_finished_at,
                  "download_elapsed_seconds": round(download_elapsed, 3),
                  "science_elapsed_seconds": round(science_elapsed, 3),
                  "ram_before_science_rss_bytes": rss_before,
                  "ram_after_science_rss_bytes": rss_after,
                  "peak_science_rss_bytes_observed": peak_rss[0],
                  "disk_before_download_available_bytes": before_download.free,
                  "disk_after_download_available_bytes": after_download.free,
              }
              summary_path.write_text(json.dumps(summary, indent=2) + "\n")
              print(f"SCIENCE_RSS_BEFORE_BYTES: {rss_before}")
              print(f"SCIENCE_RSS_AFTER_BYTES: {rss_after}")
              print(f"SCIENCE_PEAK_RSS_BYTES_OBSERVED: {peak_rss[0]}")
              del report_result, result
              gc.collect()
          except Exception:
              if failure_marker is None:
                  failure_marker = "NISAR_GUNW_SCIENCE_FAILED"
              print(failure_marker)
              exit_code = 1
          finally:
              try:
                  if raw_path is not None and raw_path.exists():
                      raw_path.unlink()
                  if raw_dir.exists():
                      shutil.rmtree(raw_dir)
                  if raw_path is not None and raw_path.exists():
                      raise RuntimeError("raw file remains")
                  if raw_dir.exists():
                      raise RuntimeError("raw directory remains")
                  cleanup_succeeded = True
              except Exception:
                  print("NISAR_GUNW_RAW_CLEANUP_FAILED")
                  exit_code = 1

              if cleanup_succeeded:
                  final_disk = disk_snapshot("AFTER_RAW_CLEANUP")
                  print("NISAR_GUNW_RAW_CLEANUP_SUCCESS")
                  if failure_marker is None:
                      total_elapsed = monotonic() - test_start
                      print("NISAR_GUNW_SCIENCE_SUCCESS")
                      print(f"PEAK_DISK_USED_BYTES: {max(before_download.total - before_download.free, after_download.total - after_download.free) if 'before_download' in locals() else 0}")
                      print(f"FINAL_AVAILABLE_DISK_BYTES: {final_disk.free}")
                      print(f"TEST_ELAPSED_SECONDS: {total_elapsed:.3f}")
                      print(f"COMPACT_OUTPUT_PATH: {summary_path}")
                      print(f"SCIENCE_COMMIT: {EXPECTED_COMMIT}")
              else:
                  print("NISAR_GUNW_RAW_CLEANUP_FAILED")

          sys.exit(exit_code)
          PY