name: NISAR GCOV Earthaccess discovery diagnostic
run-name: NISAR GCOV catalogue discovery diagnostic

# Manual-only catalogue test. No NISAR download or processing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Require explicit Monorepo NISAR diagnostics opt-in
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed before Earthdata access
        env:
          ENABLED: ${{ vars.MONOREPO_NISAR_DIAGNOSTICS_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::NISAR diagnostics are disabled."
            exit 1
          fi

  discover:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false
      - name: Install Earthdata client
        run: python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 earthaccess==0.16.0
      - name: Authenticate and query one GCOV result
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EARTHDATA_USERNAME"
          test -n "$EARTHDATA_PASSWORD"
          python - <<'PY'
          import earthaccess
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          import sys

          try:
              auth = earthaccess.login(strategy="environment")
              if not auth:
                  raise RuntimeError("Earthdata authentication returned no session")
              results = earthaccess.search_data(
                  short_name="NISAR_L2_GCOV_PROVISIONAL_V1",
                  count=1,
              )
              if not results:
                  raise RuntimeError("GCOV catalogue returned no results")
              out = Path(os.environ["RUNNER_TEMP"]) / "nisar-gcov-discovery.json"
              out.write_text(json.dumps({
                  "status": "PASS",
                  "collection": "NISAR_L2_GCOV_PROVISIONAL_V1",
                  "result_count": len(results),
                  "catalogue_only": True,
                  "raw_download_performed": False,
                  "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              }, indent=2) + "\n", encoding="utf-8")
              print("NISAR_GCOV_DISCOVERY=PASS")
              print(f"NISAR_GCOV_RESULT_COUNT={len(results)}")
              print("RAW_DOWNLOAD_PERFORMED=no")
          except Exception as exc:
              print("NISAR_GCOV_DISCOVERY=FAIL")
              print(f"SAFE_ERROR_TYPE={type(exc).__name__}")
              sys.exit(1)
          PY
      - name: Upload catalogue-only result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nisar-gcov-discovery-${{ github.run_id }}
          path: ${{ runner.temp }}/nisar-gcov-discovery.json
          if-no-files-found: warn
          retention-days: 7
      - name: State the diagnostic scope
        if: always()
        run: |
          {
            echo "## NISAR GCOV discovery"
            echo "- Catalogue only; no raw download, SAR processing or Drive upload."
          } >> "$GITHUB_STEP_SUMMARY"
