name: SARGuardian Live Retention Validation (Monorepo, fixed P05023 source AOI)

on:
  workflow_dispatch:
    inputs:
      confirm_live_retention:
        description: "Confirm the fixed P05023 GUNW and GOFF products may be downloaded and engine-ready copies retained in Google Drive."
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sarguardian-nisar-data-processing
  cancel-in-progress: false

jobs:
  preflight:
    name: Fail-closed manual live-retention consent
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require repository opt-in and per-run consent before credentials are exposed
        shell: bash
        env:
          LIVE_RETENTION_ENABLED: ${{ vars.MONOREPO_SARGUARDIAN_LIVE_VALIDATION_ENABLED }}
          CONFIRM_LIVE_RETENTION: ${{ inputs.confirm_live_retention }}
        run: |
          set -euo pipefail
          if [[ "$LIVE_RETENTION_ENABLED" != "true" ]]; then
            echo "MONOREPO_SARGUARDIAN_LIVE_VALIDATION_GATE=CLOSED"
            exit 1
          fi
          if [[ "$CONFIRM_LIVE_RETENTION" != "true" ]]; then
            echo "MONOREPO_SARGUARDIAN_LIVE_RETENTION_CONSENT=MISSING"
            exit 1
          fi
          echo "MONOREPO_SARGUARDIAN_LIVE_VALIDATION_GATE=PASS"
          echo "MONOREPO_SARGUARDIAN_LIVE_RETENTION_CONSENT=PASS"

  validate-retention:
    name: Live ${{ matrix.product_type }} retention and Google Drive verification
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - product_type: GUNW
            granule_name: NISAR_L2_PR_GUNW_026_048_D_074_028_4000_SH_20260723T125813_20260723T125848_20260816T125812_20260816T125846_P05023_N_F_J_001
          - product_type: GOFF
            granule_name: NISAR_L2_PR_GOFF_026_048_D_074_028_4000_SH_20260723T125813_20260723T125848_20260816T125812_20260816T125846_P05023_N_F_J_001
    env:
      ENGINE_TOOLS: engines/find-displacements/tools
      SCIENCE_SOURCE_COMMIT: ab547ecc82bcc4d6ccef545a59852536c2beacc6
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
      GRANULE_NAME: ${{ matrix.granule_name }}
      PRODUCT_TYPE: ${{ matrix.product_type }}
      MATURITY: PROVISIONAL
      DRIVE_VERSION_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
      AOI_NAME: source
      EXPECTED_SOURCE_BYTES: "0"
      INCLUDE_WRAPPED: "false"
      RETENTION_PROFILE: engine-ready
      DERIVE_WRAPPED_PHASE: "false"

    steps:
      - name: Checkout Monorepo with pinned source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize the exact historical NISAR science commit from Monorepo history
        id: science_source
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SCIENCE_SOURCE_COMMIT^{commit}"
          science_root="$RUNNER_TEMP/sarguardian-live-validation/science-source"
          mkdir -p "$(dirname "$science_root")"
          git worktree add --detach "$science_root" "$SCIENCE_SOURCE_COMMIT"
          actual="$(git -C "$science_root" rev-parse HEAD)"
          test "$actual" = "$SCIENCE_SOURCE_COMMIT"
          echo "science_commit=$actual" >> "$GITHUB_OUTPUT"
          echo "science_root=$science_root" >> "$GITHUB_OUTPUT"
          echo "PINNED_NISAR_SCIENCE_COMMIT_VERIFIED=$actual"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            science/nisar-core/requirements.txt
            engines/find-displacements/tools/requirements-retention.txt

      - name: Install exact science and retention dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r "${{ steps.science_source.outputs.science_root }}/requirements.txt"
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r "$ENGINE_TOOLS/requirements-retention.txt"

      - name: Prepare isolated runner directories
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sarguardian-live-validation"
          mkdir -p "$root/raw" "$root/curated"
          chmod 700 "$root" "$root/raw" "$root/curated"
          echo "root_dir=$root" >> "$GITHUB_OUTPUT"
          echo "raw_dir=$root/raw" >> "$GITHUB_OUTPUT"
          echo "curated_dir=$root/curated" >> "$GITHUB_OUTPUT"

      - name: Download exactly one known AOI product
        id: download
        shell: bash
        env:
          RAW_DIR: ${{ steps.paths.outputs.raw_dir }}
          SCIENCE_ROOT: ${{ steps.science_source.outputs.science_root }}
        run: |
          set -euo pipefail
          args=(--product-type "$PRODUCT_TYPE" --maturity "$MATURITY" --granule-name "$GRANULE_NAME" --science-root "$SCIENCE_ROOT" --aoi "$AOI_NAME" --out-dir "$RAW_DIR")
          if [[ "$EXPECTED_SOURCE_BYTES" =~ ^[0-9]+$ ]] && [[ "$EXPECTED_SOURCE_BYTES" -gt 0 ]]; then
            args+=(--expected-source-bytes "$EXPECTED_SOURCE_BYTES")
          fi
          log="$RUNNER_TEMP/sarguardian-live-download.log"
          python "$ENGINE_TOOLS/download_nisar_product.py" "${args[@]}" | tee "$log"
          raw_path="$(sed -n 's/^RAW_PRODUCT_PATH=//p' "$log" | tail -n 1)"
          test -n "$raw_path" && test -f "$raw_path"
          echo "raw_path=$raw_path" >> "$GITHUB_OUTPUT"

      - name: Validate product grid against science AOI before archive work
        id: aoi_preflight
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
          SCIENCE_COMMIT: ${{ steps.science_source.outputs.science_commit }}
          SCIENCE_ROOT: ${{ steps.science_source.outputs.science_root }}
        run: |
          set -euo pipefail
          python "$ENGINE_TOOLS/validate_product_aoi.py" \
            --input "$RAW_PATH" --product-type "$PRODUCT_TYPE" --aoi "$AOI_NAME" \
            --science-root "$SCIENCE_ROOT" --science-commit "$SCIENCE_COMMIT" \
            --out "$CURATED_DIR/preflight-report.json"

      - name: Inventory complete source HDF5 schema
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
        run: |
          set -euo pipefail
          python "$ENGINE_TOOLS/sarguardian_hdf5_archive.py" inventory \
            --input "$RAW_PATH" --product-type "$PRODUCT_TYPE" \
            --out "$CURATED_DIR/source-inventory.json"

      - name: Build engine-ready native-copy archive and verify locally
        id: archive
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
        run: |
          set -euo pipefail
          stem="${RAW_PATH##*/}"
          stem="${stem%.*}"
          archive="$CURATED_DIR/${stem}.science.h5"
          manifest="$CURATED_DIR/${stem}.retention-manifest.json"
          args=(archive --input "$RAW_PATH" --out "$archive" --manifest "$manifest" \
            --product-type "$PRODUCT_TYPE" --retention-profile "$RETENTION_PROFILE")
          if [[ "$INCLUDE_WRAPPED" == "true" ]]; then args+=(--include-wrapped); fi
          if [[ "$DERIVE_WRAPPED_PHASE" == "true" ]]; then args+=(--derive-wrapped-phase); fi
          echo "ARCHIVE_BUILD_STARTED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python "$ENGINE_TOOLS/sarguardian_hdf5_archive.py" "${args[@]}"
          echo "ARCHIVE_BUILD_FINISHED_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "archive_path=$archive" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest" >> "$GITHUB_OUTPUT"

      - name: Compare raw and curated scientific reader and downstream LOS outputs
        id: reader_equivalence
        shell: bash
        env:
          RAW_PATH: ${{ steps.download.outputs.raw_path }}
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
          SCIENCE_COMMIT: ${{ steps.science_source.outputs.science_commit }}
          SCIENCE_ROOT: ${{ steps.science_source.outputs.science_root }}
        run: |
          set -euo pipefail
          python "$ENGINE_TOOLS/verify_reader_equivalence.py" \
            --product-type "$PRODUCT_TYPE" --source "$RAW_PATH" --archive "$ARCHIVE_PATH" \
            --science-root "$SCIENCE_ROOT" --science-commit "$SCIENCE_COMMIT" --aoi "$AOI_NAME" \
            --preflight-report "$CURATED_DIR/preflight-report.json" \
            --out "$CURATED_DIR/reader-equivalence.json"

      - name: Upload archive and provenance to Google Drive with remote size and MD5 verification
        id: drive_archive
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.archive.outputs.archive_path }}
          MANIFEST_PATH: ${{ steps.archive.outputs.manifest_path }}
          CURATED_DIR: ${{ steps.paths.outputs.curated_dir }}
          RAW_DIR: ${{ steps.paths.outputs.raw_dir }}
        run: |
          set -euo pipefail
          cp "$RAW_DIR/download-manifest.json" "$CURATED_DIR/download-manifest.json"
          python "$ENGINE_TOOLS/drive_resumable_upload.py" \
            --root "$CURATED_DIR" --product-type "$PRODUCT_TYPE" --maturity "$MATURITY" \
            --granule-name "$GRANULE_NAME" \
            --version-tag "$DRIVE_VERSION_TAG" \
            --files "$ARCHIVE_PATH" "$MANIFEST_PATH" \
              "$CURATED_DIR/source-inventory.json" "$CURATED_DIR/preflight-report.json" \
              "$CURATED_DIR/reader-equivalence.json" "$CURATED_DIR/download-manifest.json" \
            --out "$CURATED_DIR/drive-retention-receipt.json"
          python "$ENGINE_TOOLS/drive_resumable_upload.py" \
            --root "$CURATED_DIR" --product-type "$PRODUCT_TYPE" --maturity "$MATURITY" \
            --granule-name "$GRANULE_NAME" \
            --version-tag "$DRIVE_VERSION_TAG" \
            --files "$CURATED_DIR/drive-retention-receipt.json" \
            --out "$CURATED_DIR/drive-receipt-upload-receipt.json"
          echo "DRIVE_ARCHIVE_VERIFICATION=PASS"

      - name: Upload diagnostic receipts even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarguardian-live-retention-${{ matrix.product_type }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sarguardian-live-validation/curated/source-inventory.json
            ${{ runner.temp }}/sarguardian-live-validation/curated/preflight-report.json
            ${{ runner.temp }}/sarguardian-live-validation/curated/*retention-manifest.json
            ${{ runner.temp }}/sarguardian-live-validation/curated/reader-equivalence.json
            ${{ runner.temp }}/sarguardian-live-validation/curated/drive-retention-receipt.json
            ${{ runner.temp }}/sarguardian-live-validation/curated/drive-receipt-upload-receipt.json
            ${{ runner.temp }}/sarguardian-live-validation/raw/download-manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Report non-destructive result scope
        if: always()
        shell: bash
        run: |
          echo "PILOT_SCOPE=ONE_PRODUCT_PER_MATRIX_ENTRY"
          echo "PRODUCT_TYPE=$PRODUCT_TYPE"
          echo "RETENTION_PROFILE=$RETENTION_PROFILE"
          echo "AUTOMATIC_RAW_DELETION=DISABLED"
          echo "LIVE_DRIVE_AND_SCIENCE_VALIDATION_REQUIRED=YES"

      - name: Remove local pinned science worktree
        if: always()
        shell: bash
        run: |
          git worktree remove "$RUNNER_TEMP/sarguardian-live-validation/science-source" --force || true
