name: SARGuardian Extended Scientific Evidence (Monorepo)
run-name: Extend verified source-AOI science from Monorepo run ${{ inputs.source_run_id }}

# Manual-only continuation from a full, successful source-AOI result bundle.
# It consumes derived artifacts only and never re-downloads or extracts raw HDF5.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful full-source-baseline sarguardian-streaming-batch run from this Monorepo Preview branch."
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: monorepo-nisar-extended-science-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require explicit Monorepo extended-science opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before source artifact access
        env:
          ENABLED: ${{ vars.MONOREPO_EXTENDED_SCIENCE_ENABLED }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::Extended science is disabled. Enable only for an approved Monorepo Preview derived-artifact continuation."
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{5,19}$ ]]; then
            echo "::error::source_run_id must be a numeric Monorepo Actions run ID."
            exit 1
          fi
          echo "MONOREPO_EXTENDED_SCIENCE_GATE=PASS"

  extended-science:
    name: Recompute remaining science from verified derived data
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: migration/source-snapshots/backend-main
    steps:
      - name: Check out full Monorepo history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract exact ab547 science source from Monorepo Git history
        shell: bash
        env:
          SCIENCE_COMMIT: ab547ecc82bcc4d6ccef545a59852536c2beacc6
        run: |
          set -euo pipefail
          mkdir -p science-source
          git -C "$GITHUB_WORKSPACE" cat-file -e "$SCIENCE_COMMIT^{commit}"
          git -C "$GITHUB_WORKSPACE" archive "$SCIENCE_COMMIT" | tar -x -C science-source
          test -s science-source/src/gunw_reader.py
          test -s science-source/src/goff_reader.py
          test -s science-source/requirements.txt
          echo "EXTENDED_SCIENCE_SOURCE_PIN=PASS"

      - name: Verify source run is successful and has the exact Monorepo aggregate artifact
        id: source
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          run_id = os.environ["SOURCE_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]{5,19}", run_id):
              raise SystemExit("SOURCE_RUN_ID_INVALID")
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"GITHUB_API_LOOKUP_FAILED_HTTP_{exc.code}") from None

          run = get_json(f"{base}/actions/runs/{run_id}")
          if run.get("repository", {}).get("full_name", "").lower() != repo.lower():
              raise SystemExit("SCIENCE_SOURCE_RUN_NOT_FROM_THIS_MONOREPO")
          if run.get("head_repository", {}).get("full_name", "").lower() != repo.lower():
              raise SystemExit("SCIENCE_SOURCE_HEAD_REPOSITORY_NOT_MONOREPO")
          if run.get("head_branch") != os.environ["EXPECTED_BRANCH"]:
              raise SystemExit("SCIENCE_SOURCE_BRANCH_MISMATCH")
          if run.get("event") != "workflow_dispatch":
              raise SystemExit("SCIENCE_SOURCE_RUN_MUST_BE_MANUALLY_DISPATCHED")
          if run.get("path") != ".github/workflows/sarguardian-streaming-batch.yml":
              raise SystemExit("SCIENCE_SOURCE_RUN_NOT_MONOREPO_STREAMING_BATCH")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("SCIENCE_SOURCE_RUN_NOT_SUCCESSFUL")
          attempt = run.get("run_attempt")
          if not isinstance(attempt, int) or attempt < 1:
              raise SystemExit("SCIENCE_SOURCE_RUN_ATTEMPT_INVALID")

          artifact_name = f"sarguardian-streaming-run-{run_id}-{attempt}"
          artifact_payload = get_json(f"{base}/actions/runs/{run_id}/artifacts?per_page=100")
          artifacts = artifact_payload.get("artifacts")
          if not isinstance(artifacts, list):
              raise SystemExit("SCIENCE_SOURCE_ARTIFACT_LIST_INVALID")
          match = next((
              item for item in artifacts
              if isinstance(item, dict)
              and item.get("name") == artifact_name
              and item.get("expired") is False
              and int(item.get("size_in_bytes", 0)) > 0
          ), None)
          if match is None:
              raise SystemExit("SCIENCE_SOURCE_AGGREGATE_ARTIFACT_MISSING_OR_EXPIRED")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
              output.write(f"run_attempt={attempt}\n")
              output.write(f"artifact_name={artifact_name}\n")
          print("MONOREPO_EXTENDED_SCIENCE_SOURCE_RUN=PASS")
          print(f"SOURCE_RUN_ID={run_id}")
          print(f"SOURCE_RUN_ATTEMPT={attempt}")
          print(f"SOURCE_ARTIFACT={artifact_name}")
          print("RAW_HDF5_REPLAY_REQUIRED=no")
          PY

      - name: Download only the selected Monorepo aggregate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sarguardian-source-bundle

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install exact science and retention dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r science-source/requirements.txt
          python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r tools/requirements-retention.txt

      - name: Run the extended science workflow without raw HDF5 replay
        id: science_results
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/sarguardian-source-bundle"
          bundle="$(find "$source_root" -type f -name 'sarguardian-*-results.zip' -print -quit)"
          test -n "$bundle" && test -s "$bundle"
          python -u tools/run_extended_science.py \
            --source-bundle "$bundle" \
            --source-run-id "$SOURCE_RUN_ID" \
            --science-root "$PWD/science-source" \
            --out-root "$RUNNER_TEMP/sarguardian-extended-science"

      - name: Publish extended science result bundle and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sarguardian-extended-science-${{ steps.source.outputs.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sarguardian-extended-science/sarguardian-extended-science-*.zip
            ${{ runner.temp }}/sarguardian-extended-science/science-extension-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the verified extended science result bundle to private Drive
        if: always() && steps.science_results.outputs.status == 'PASS'
        shell: bash
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          RUN_ID_SAFE: SARGuardian-ScienceExtensions-${{ steps.source.outputs.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          OUT_ROOT: ${{ runner.temp }}/sarguardian-extended-science
        run: |
          set -euo pipefail
          if [[ -z "$GOOGLE_DRIVE_OAUTH_CLIENT_JSON" || -z "$GOOGLE_DRIVE_REFRESH_TOKEN" || -z "$GOOGLE_DRIVE_PARENT_FOLDER_ID" ]]; then
            echo "::error::PRIVATE_DRIVE_SECRETS_MISSING"
            exit 1
          fi
          bundle="$(find "$OUT_ROOT" -maxdepth 1 -name 'sarguardian-extended-science-*.zip' -type f -print -quit)"
          report="$OUT_ROOT/science-extension-report.json"
          test -s "$bundle" && test -s "$report"
          python tools/drive_resumable_upload.py \
            --root "$OUT_ROOT" --run-name "$RUN_ID_SAFE" \
            --files "$bundle" "$report" --out "$OUT_ROOT/drive-run-upload-receipt.json"
          python tools/drive_resumable_upload.py \
            --root "$OUT_ROOT" --run-name "$RUN_ID_SAFE" \
            --files "$OUT_ROOT/drive-run-upload-receipt.json" \
            --out "$OUT_ROOT/drive-run-receipt-upload.json"
          echo "EXTENDED_SCIENCE_DRIVE_VERIFICATION=PASS"
