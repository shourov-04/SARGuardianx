name: RiverShift retained-run Sentinel-2 cross-sensor replay (Monorepo)
run-name: RiverShift Sentinel-2 · Monorepo run ${{ inputs.source_run_id }} · ${{ inputs.observation_date }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Monorepo RiverShift GCOV run containing retained COG artifacts
        required: true
        type: string
      source_job_id:
        description: RiverShift job UUID used for prepared and product artifacts
        required: true
        type: string
      api_base_url:
        description: Monorepo Preview API only
        required: true
        type: string
        default: "https://sar-guardi-git-ed4bd9-moshiour-rahman-sarkers-projects-2cebe363.vercel.app"
      observation_date:
        description: Exact NISAR acquisition date (YYYY-MM-DD)
        required: true
        type: string
      max_day_offset:
        description: Maximum Sentinel-2 acquisition-date offset
        required: true
        type: choice
        options: ["0", "1", "2", "3", "5", "7"]
        default: "3"
      max_cloud_cover:
        description: Maximum Sentinel-2 scene cloud cover percentage
        required: true
        type: choice
        options: ["20", "40", "60", "80", "100"]
        default: "100"
      mndwi_threshold:
        description: MNDWI threshold using B03 and B11
        required: true
        type: string
        default: "0.0"
      minimum_common_support:
        description: Minimum clear optical support fraction
        required: true
        type: choice
        options: ["0.80", "0.85", "0.90", "0.95", "0.99"]
        default: "0.80"

permissions:
  actions: read
  contents: read

concurrency:
  group: monorepo-rivershift-sentinel2-${{ inputs.source_run_id }}-${{ inputs.observation_date }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require Sentinel-2 retained replay opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before artifact, API or Drive access
        env:
          ENABLED: ${{ vars.MONOREPO_RIVERSHIFT_SENTINEL2_REPLAY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::RiverShift Sentinel-2 retained replay is disabled."
            exit 1
          fi
          echo "MONOREPO_RIVERSHIFT_SENTINEL2_REPLAY_GATE=PASS"

  cross-sensor:
    name: Rebuild retained NISAR water mask and compare with Sentinel-2
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_JOB_ID: ${{ inputs.source_job_id }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      API_BASE_URL: ${{ inputs.api_base_url }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out full Monorepo history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful Monorepo source run and retained products
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python engines/river-shift/tools/river_shift/verify_monorepo_source_run.py             --source-run-id "$SOURCE_RUN_ID"             --source-job-id "$SOURCE_JOB_ID"             --expected-branch "$EXPECTED_BRANCH"             --require-products             --output "$RUNNER_TEMP/rivershift-source-run-verification.json"

      - name: Verify the API URL is the Monorepo Preview API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          expected = "sar-guardi-git-ed4bd9-moshiour-rahman-sarkers-projects-2cebe363.vercel.app"
          parsed = urlsplit(os.environ["API_BASE_URL"])
          if parsed.scheme != "https" or parsed.hostname != expected or parsed.username or parsed.password:
              raise SystemExit("API_BASE_URL_MUST_BE_THE_MONOREPO_PREVIEW_API")
          print("RIVERSHIFT_API_TARGET=MONOREPO_PREVIEW")
          PY

      - name: Download exact retained prepared manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rivershift-prepared-${{ inputs.source_job_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source-prepared

      - name: Download retained per-product GCOV COG artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rivershift-product-*
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source-products
          merge-multiple: false

      - name: Bind the exact source workflow run to a local prepared-manifest copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          matches = sorted(Path("source-prepared").rglob("prepared.json"))
          if len(matches) != 1:
              raise SystemExit("EXPECTED_EXACTLY_ONE_PREPARED_MANIFEST")
          source_path = matches[0]
          original = source_path.read_bytes()
          payload = json.loads(original)
          if payload.get("job_id") != os.environ["SOURCE_JOB_ID"]:
              raise SystemExit("PREPARED_MANIFEST_JOB_ID_MISMATCH")
          previous_run = payload.get("source_workflow_run_id")
          if previous_run not in (None, "", os.environ["SOURCE_RUN_ID"]):
              raise SystemExit("PREPARED_MANIFEST_SOURCE_RUN_ID_MISMATCH")
          payload["source_workflow_run_id"] = os.environ["SOURCE_RUN_ID"]
          payload["monorepo_retained_artifact_binding"] = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_workflow_run_id": os.environ["SOURCE_RUN_ID"],
              "source_job_id": os.environ["SOURCE_JOB_ID"],
              "original_prepared_sha256": hashlib.sha256(original).hexdigest(),
              "original_manifest_mutated": False,
          }
          out = Path("prepared-bound")
          out.mkdir(parents=True, exist_ok=True)
          (out / "prepared.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          (out / "monorepo-source-binding.json").write_text(json.dumps(payload["monorepo_retained_artifact_binding"], indent=2) + "\n", encoding="utf-8")
          print("RIVERSHIFT_PREPARED_SOURCE_BINDING=PASS")
          PY

      - name: Install the pinned RiverShift geospatial environment
        uses: mamba-org/setup-micromamba@f45730a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-file: engines/river-shift/tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true

      - name: Recompute NISAR time-series and Sentinel-2 cross-sensor screen
        shell: micromamba-shell {0}
        env:
          OBSERVATION_DATE: ${{ inputs.observation_date }}
          MAX_DAY_OFFSET: ${{ inputs.max_day_offset }}
          MAX_CLOUD_COVER: ${{ inputs.max_cloud_cover }}
          MNDWI_THRESHOLD: ${{ inputs.mndwi_threshold }}
          MINIMUM_COMMON_SUPPORT: ${{ inputs.minimum_common_support }}
        run: |
          set -euo pipefail
          python -u engines/river-shift/tools/river_shift/replay_sentinel2_from_retained_run.py             --products-dir source-products             --prepared-dir prepared-bound             --source-run-id "$SOURCE_RUN_ID"             --observation-date "$OBSERVATION_DATE"             --output-dir replay-output             --max-day-offset "$MAX_DAY_OFFSET"             --max-cloud-cover "$MAX_CLOUD_COVER"             --mndwi-threshold "$MNDWI_THRESHOLD"             --minimum-common-support "$MINIMUM_COMMON_SUPPORT"

      - name: Upload Sentinel-2 reference candidates and validate against retained RiverShift job
        id: independent-validation
        shell: micromamba-shell {0}
        env:
          GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          RIVERSHIFT_CALLBACK_SECRET: ${{ secrets.RIVERSHIFT_CALLBACK_SECRET }}
        run: |
          set -euo pipefail
          python -u engines/river-shift/tools/river_shift/publish_sentinel2_references.py             --crosscheck-dir replay-output/sentinel2-cross-sensor             --prepared-dir prepared-bound             --api-base-url "$API_BASE_URL"             --output-dir replay-output/independent-validation             --maximum-date-offset-days "$MAX_DAY_OFFSET"             --minimum-common-support-fraction "$MINIMUM_COMMON_SUPPORT"             --block-size-pixels 64             --bootstrap-replicates 500

      - name: Enforce independent reference metrics gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_file="replay-output/independent-validation/sentinel2_reference_validation_status.json"
          test -s "$status_file"
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("replay-output/independent-validation/sentinel2_reference_validation_status.json").read_text(encoding="utf-8"))
          status = payload.get("status")
          print(f"RIVERSHIFT_SENTINEL2_VALIDATION_STATUS={status}")
          if status != "METRICS_COMPUTED_REVIEW_REQUIRED":
              raise SystemExit("SENTINEL2_REFERENCE_METRICS_OR_REVIEW_GATE_FAILED")
          print("RIVERSHIFT_SENTINEL2_METRICS_GATE=PASS")
          print("RIVERSHIFT_SENTINEL2_RELEASE_STATUS=PROVISIONAL_REVIEW_REQUIRED")
          PY

      - name: Retain Sentinel-2 references and provenance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: river-shift-sentinel2-reference-${{ inputs.source_run_id }}-${{ inputs.observation_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            replay-output/sentinel2-cross-sensor/sentinel2_cross_sensor_agreement.json
            replay-output/sentinel2-cross-sensor/reference-scl-water.tif
            replay-output/sentinel2-cross-sensor/reference-mndwi-water.tif
            replay-output/cross_sensor_replay_manifest.json
            replay-output/independent-validation/independent_reference_validation_scl.json
            replay-output/independent-validation/independent_reference_validation_mndwi.json
            replay-output/independent-validation/sentinel2_reference_validation_status.json
            replay-output/independent-validation/sentinel2_reference_drive_receipt.json
            prepared-bound/monorepo-source-binding.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Publish privacy-safe scientific summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report_path = Path("replay-output/sentinel2-cross-sensor/sentinel2_cross_sensor_agreement.json")
          manifest_path = Path("replay-output/cross_sensor_replay_manifest.json")
          print("## RiverShift Sentinel-2 retained-data cross-sensor replay")
          print()
          if not report_path.is_file() or not manifest_path.is_file():
              print("No cross-sensor report was produced; review the preceding job logs.")
              raise SystemExit(0)
          report = json.loads(report_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          print(f"- Status: **{report.get('status')}**")
          print(f"- Monorepo source run: {manifest.get('source_workflow_run_id')}")
          print(f"- Source job UUID: {manifest.get('source_job_id')}")
          print(f"- NISAR observation date: {manifest.get('requested_observation_date')}")
          print(f"- Sentinel-2 observation date: {(report.get('observation') or {}).get('sentinel2_date', 'not found')}")
          print(f"- Common clear support: {(report.get('spatial_support') or {}).get('common_support_fraction', 'not available')}")
          print(f"- Metrics available: {isinstance(report.get('metrics'), dict)}")
          print()
          print("**Interpretation:** Sentinel-2 SCL/MNDWI layers are cross-sensor candidate labels, not ground truth or field validation. The NISAR source job remains PROVISIONAL; independent review is required.")
          PY
