name: SARGuardian AOI WKT E2E (Monorepo dispatcher)
run-name: SARGuardian AOI ${{ inputs.start_date }}..${{ inputs.end_date }}

# Central Monorepo entry point. Never dispatches to the old Backend repository.
on:
  workflow_dispatch:
    inputs:
      aoi_wkt:
        description: "Single-ring WKT POLYGON in EPSG:4326; coordinates are longitude latitude. No holes or MULTIPOLYGON."
        required: true
        type: string
        default: "POLYGON ((84.99140223107368 28.499061219892724, 84.945606791564 28.28220804656594, 85.18844724834032 28.270753557383987, 85.20285565607317 28.414428221022945, 85.11305609453537 28.49639181334535, 84.99140223107368 28.499061219892724))"
      start_date:
        description: "Inclusive start date for secondary acquisition dates (YYYY-MM-DD); reference date may predate it."
        required: true
        type: string
        default: "2026-06-17"
      end_date:
        description: "Inclusive end date for secondary acquisition dates (YYYY-MM-DD)."
        required: true
        type: string
        default: "2026-09-15"
      date_filter_mode:
        description: "Default selects by secondary acquisition date; strict mode requires both pair acquisitions inside the interval."
        required: true
        type: choice
        options:
          - both-acquisitions-in-window
          - secondary-acquisition-in-window
        default: secondary-acquisition-in-window
      run_profile:
        description: "Start with validation pilot; full AOI baseline processes every matching catalog product."
        required: true
        type: choice
        options:
          - validation-pilot
          - full-aoi-baseline
        default: validation-pilot
      retention_profile:
        description: "Choose derived outputs only or retain a full lossless HDF5 archive as well."
        required: true
        type: choice
        options:
          - derived-only
          - full-lossless
        default: derived-only

permissions:
  contents: read
  actions: read

concurrency:
  group: monorepo-aoi-manual-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require explicit Monorepo Find Displacements opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before worker checkout or data access
        env:
          MONOREPO_DISPLACEMENT_ENABLED: ${{ vars.MONOREPO_DISPLACEMENT_ACTIONS_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MONOREPO_DISPLACEMENT_ENABLED" != "true" ]]; then
            echo "::error::Monorepo Find Displacements is disabled. Enable only after all workflow, credential, callback and rollback checks pass."
            exit 1
          fi
          echo "MONOREPO_FIND_DISPLACEMENTS_MANUAL_GATE=PASS"

  run-isolated-aoi-pipeline:
    name: Run the local Monorepo Find Displacements engine
    needs: preflight
    uses: ./.github/workflows/sarguardian-aoi-dashboard-engine.yml
    with:
      aoi_wkt: ${{ inputs.aoi_wkt }}
      start_date: ${{ inputs.start_date }}
      end_date: ${{ inputs.end_date }}
      date_filter_mode: ${{ inputs.date_filter_mode }}
      run_profile: ${{ inputs.run_profile }}
      retention_profile: ${{ inputs.retention_profile }}
    secrets:
      DISPLACEMENT_CALLBACK_SECRET: ${{ secrets.DISPLACEMENT_CALLBACK_SECRET }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
