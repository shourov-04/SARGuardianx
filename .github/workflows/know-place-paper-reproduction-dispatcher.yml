name: SARGuardian · Known Place Author-Exact Paper Reproduction dispatcher (Monorepo)

run-name: Known Place Paper Reproduction ${{ inputs.request_id }}

# Monorepo entry point for the separately pinned author-exact P05023 reproduction.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "API-generated request ID used to match this run to the user's request"
        required: true
        type: string
      consent_marker:
        description: "Exact [run-know-place] marker is sent only after explicit author-exact consent"
        required: true
        type: string
      geometry_height_m:
        description: "Pinned exploratory geometry height in metres"
        required: true
        default: "5151"
        type: string
      control_draws:
        description: "Deterministic exploratory control draws"
        required: true
        default: "1000"
        type: string
      seed:
        description: "Deterministic exploratory seed"
        required: true
        default: "260826"
        type: string

permissions:
  contents: read

concurrency:
  group: known-place-paper-reproduction-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  author-exact-p05023-replay:
    name: Run exact-author Bhote Koshi P05023 replay
    uses: ./.github/workflows/know-place-author-exact-replay.yml
    with:
      backend_code_ref: "b825df798ea4cb9874aa10dd01174d2a8ef73cba"
      consent_marker: ${{ inputs.consent_marker }}
      bridge_authorized: false
      geometry_height_m: ${{ inputs.geometry_height_m }}
      control_draws: ${{ inputs.control_draws }}
      seed: ${{ inputs.seed }}
    secrets:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
