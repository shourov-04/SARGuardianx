name: RiverShift retained Run 36 retrospective overlap replay (Monorepo)
run-name: RiverShift Run 36 benchmark replay · Monorepo run ${{ inputs.source_run_id }}

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Monorepo RiverShift GCOV run containing retained COG artifacts
        required: true
        type: string
      source_job_id:
        description: RiverShift job UUID used for the prepared and product artifact names
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: monorepo-rivershift-run36-${{ inputs.source_run_id }}-${{ inputs.source_job_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require Run 36 retrospective replay opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail closed before retained artifact access
        env:
          ENABLED: ${{ vars.MONOREPO_RIVERSHIFT_RUN36_REPLAY_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ENABLED" != "true" ]]; then
            echo "::error::RiverShift Run 36 retrospective replay is disabled."
            exit 1
          fi
          echo "MONOREPO_RIVERSHIFT_RUN36_REPLAY_GATE=PASS"

  replay:
    name: Recompute Run 36 area metrics from six retained Monorepo GCOV COGs
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_JOB_ID: ${{ inputs.source_job_id }}
      EXPECTED_BRANCH: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out full Monorepo history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Monorepo source run and retained prepared/product artifacts
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python engines/river-shift/tools/river_shift/verify_monorepo_source_run.py             --source-run-id "$SOURCE_RUN_ID"             --source-job-id "$SOURCE_JOB_ID"             --expected-branch "$EXPECTED_BRANCH"             --require-products             --output "$RUNNER_TEMP/rivershift-source-run-verification.json"

      - name: Download exact retained prepared manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rivershift-prepared-${{ inputs.source_job_id }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: rivershift-run36-replay/prepared

      - name: Download retained per-product GCOV COG artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rivershift-product-b01-*
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: rivershift-run36-replay/products
          merge-multiple: false

      - name: Install the pinned RiverShift geospatial environment
        uses: mamba-org/setup-micromamba@f45730a868e4760d3a6fcea5f25dc655b8edf39
        with:
          environment-file: engines/river-shift/tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true

      - name: Recompute retrospective Run 36 benchmark from immutable retained COGs
        id: benchmark
        shell: micromamba-shell {0}
        env:
          SOURCE_RUN_NUMBER: ${{ steps.source.outputs.run_number }}
        run: |
          set -euo pipefail
          python --version
          python -m compileall -q engines/river-shift/tools/river_shift/replay_retained_run36_monorepo.py
          python -u engines/river-shift/tools/river_shift/replay_retained_run36_monorepo.py             --prepared-root rivershift-run36-replay/prepared             --products-root rivershift-run36-replay/products             --output-root rivershift-run36-replay/output             --source-run-id "$SOURCE_RUN_ID"             --source-run-number "$SOURCE_RUN_NUMBER"             --source-job-id "$SOURCE_JOB_ID"

      - name: Publish retrospective audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rivershift-run36-retrospective-overlap-${{ inputs.source_run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rivershift-run36-replay/output/run36_retrospective_overlap_replay.json
            rivershift-run36-replay/output/run36_retrospective_overlap_replay.json.sha256
            rivershift-run36-replay/output/outputs/quality-assurance/candidate_mask_overlap_audit.json
            rivershift-run36-replay/output/outputs/quality-assurance/erosion_mask.tif
            rivershift-run36-replay/output/outputs/quality-assurance/deposition_mask.tif
            rivershift-run36-replay/output/outputs/quality-assurance/new_water_mask.tif
            rivershift-run36-replay/output/outputs/map/river_change_candidates_preview.geojson
            rivershift-run36-replay/output/outputs/map/erosion_candidates_preview.geojson
            rivershift-run36-replay/output/outputs/map/deposition_candidates_preview.geojson
            rivershift-run36-replay/output/outputs/map/newly_water_covered_preview.geojson
          if-no-files-found: error
          retention-days: 90
          compression-level: 1
