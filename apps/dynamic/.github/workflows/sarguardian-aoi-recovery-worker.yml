# Generated by generate_aoi_batch_assets.py.
name: SARGuardian final AOI recovery runner
'on':
  workflow_call:
    inputs:
      recovery_json:
        required: true
        type: string
      retry_count:
        required: true
        type: number
      aoi_wkt:
        required: true
        type: string
      orchestration_sha:
        required: true
        type: string
      retention_profile:
        required: true
        type: string
      job_id:
        required: false
        type: string
        default: ''
      target_latitude:
        required: false
        type: string
        default: ''
      target_longitude:
        required: false
        type: string
        default: ''
jobs:
  process:
    name: SARGuardian final AOI recovery runner
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      AOI_NAME: custom
      SARGUARDIAN_AOI_WKT: ${{ inputs.aoi_wkt }}
      AOI_ORCHESTRATION_SHA: ${{ inputs.orchestration_sha }}
      AOI_ORCHESTRATION_BRANCH: main
      SCIENCE_COMMIT: 006d4cd1485cf80e509eaf8717c12e9c6390ac09
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
    steps:
    - name: Checkout orchestration code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.repository }}
        ref: ${{ inputs.orchestration_sha }}
    - name: Verify orchestration revision
      shell: bash
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$AOI_ORCHESTRATION_SHA"

        '
    - name: Verify immutable NISAR source snapshot
      shell: bash
      run: 'set -euo pipefail

        test -s migration/source-snapshots/nisar-pins/006d4cd/README.md

        test -s migration/source-snapshots/nisar-pins/006d4cd/requirements.txt

        test -s migration/source-snapshots/nisar-pins/006d4cd/src/gunw_reader.py

        test -s migration/source-snapshots/nisar-pins/006d4cd/src/goff_reader.py

        test -s migration/source-snapshots/nisar-pins/006d4cd/src/local_floor.py

        echo "SCIENCE_REVISION_VERIFIED=$SCIENCE_COMMIT"

        '
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: '3.13'
        check-latest: false
    - name: Install pinned science and retention dependencies once per runner
      shell: bash
      run: 'set -euo pipefail

        python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r migration/source-snapshots/nisar-pins/006d4cd/requirements.txt

        python -m pip install --disable-pip-version-check --no-cache-dir --retries 5 --timeout 45 -r engines/find-displacements/tools/requirements-retention.txt

        '
    - name: Product slot 001 - recovery-final
      id: recovery_001
      if: ${{ fromJSON(inputs.recovery_json)[0].present }}
      continue-on-error: true
