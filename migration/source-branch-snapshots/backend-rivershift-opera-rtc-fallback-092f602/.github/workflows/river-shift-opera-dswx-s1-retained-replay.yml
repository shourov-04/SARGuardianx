name: RiverShift retained-run OPERA DSWx-S1 SAR cross-check

run-name: RiverShift OPERA DSWx-S1 · run ${{ inputs.source_run_id || '41803576163' }}

on:
  push:
    branches:
      - main
    paths:
      - ".github/run-triggers/rivershift-opera-dswx-s1-run36-20261104"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed RiverShift run containing the retained prepared selection manifest
        required: true
        type: string
        default: "41803576163"
      maximum_date_offset_days:
        description: Strict maximum sensing-date offset allowed for a validation score
        required: true
        type: choice
        options: ["0", "1", "2", "3", "5", "7"]
        default: "3"
      discovery_window_days:
        description: Search window for the nearest OPERA scene; scenes outside the strict score gate remain NO_SCORE
        required: true
        type: choice
        options: ["3", "7", "14", "21", "30"]
        default: "30"
      minimum_common_support_fraction:
        description: Minimum labelled OPERA WTR support over NISAR-valid pixels
        required: true
        type: choice
        options: ["0.80", "0.85", "0.90", "0.95", "0.99"]
        default: "0.80"

permissions:
  actions: read
  contents: read

concurrency:
  group: river-shift-opera-dswx-s1-${{ inputs.source_run_id || '41803576163' }}
  cancel-in-progress: false

jobs:
  reference:
    name: Build OPERA DSWx-S1 reference and compare with retained NISAR water mask
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      RIVERSHIFT_CALLBACK_SECRET: ${{ secrets.RIVERSHIFT_CALLBACK_SECRET }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}/tools/river_shift
    steps:
      - name: Check out RiverShift science tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the exact retained RiverShift prepared manifest
        uses: actions/download-artifact@v4
        with:
          pattern: rivershift-prepared-*
          path: prepared/
          run-id: ${{ inputs.source_run_id || '41803576163' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: false

      - name: Install pinned RiverShift geospatial runtime
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/river_shift/environment.yml
          cache-environment: true
          generate-run-shell: true

      - name: Verify retained selection and run OPERA DSWx-S1 SAR cross-check
        shell: micromamba-shell {0}
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id || '41803576163' }}
          MAXIMUM_DATE_OFFSET_DAYS: ${{ inputs.maximum_date_offset_days || '3' }}
          DISCOVERY_WINDOW_DAYS: ${{ inputs.discovery_window_days || '30' }}
          MINIMUM_COMMON_SUPPORT_FRACTION: ${{ inputs.minimum_common_support_fraction || '0.80' }}
        run: |
          set -euo pipefail
          echo "::group::RiverShift OPERA DSWx-S1 reference replay"
          python --version
          gdalinfo --version
          python -c "import earthaccess, rasterio, numpy, shapely, pyproj; print('RIVERSHIFT_OPERA_RUNTIME=PASS')"
          python -u tools/river_shift/run_opera_dswx_s1_reference.py \
            --prepared-dir prepared \
            --api-base-url https://sarguardian-backend-api.vercel.app \
            --output-dir opera-output \
            --maximum-date-offset-days "$MAXIMUM_DATE_OFFSET_DAYS" \
            --discovery-window-days "$DISCOVERY_WINDOW_DAYS" \
            --minimum-common-support-fraction "$MINIMUM_COMMON_SUPPORT_FRACTION" \
            --block-size-pixels 64 \
            --bootstrap-replicates 500
          echo "RIVERSHIFT_OPERA_SOURCE_RUN=$SOURCE_RUN_ID"
          echo "::endgroup::"

      - name: Retain OPERA reference and independent comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: river-shift-opera-dswx-s1-reference-${{ inputs.source_run_id || '41803576163' }}
          path: |
            opera-output/opera_dswx_s1_reference_report.json
            opera-output/opera_dswx_s1_independent_validation.json
            opera-output/opera_dswx_s1_validation_status.json
            opera-output/reference-opera-dswx-s1-water.tif
          if-no-files-found: warn
          retention-days: 30
          compression-level: 1

      - name: Publish privacy-safe scientific outcome
        if: always()
        shell: bash
        env:
          REPORT: opera-output/opera_dswx_s1_reference_report.json
          STATUS: opera-output/opera_dswx_s1_validation_status.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT"])
          status_path = Path(os.environ["STATUS"])
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["## RiverShift — OPERA DSWx-S1 SAR cross-sensor reference", ""]
          if not report_path.is_file() or not status_path.is_file():
              lines.extend([
                  "**Pipeline did not produce a complete scientific report.** Review the preceding logs.",
                  "",
                  "The original RiverShift processing result was not modified.",
              ])
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              status = json.loads(status_path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Status: **{status.get('status')}**",
                  f"- Source job: {status.get('source_job_id')}",
                  f"- NISAR observation: {status.get('requested_nisar_observation_date')}",
                  f"- OPERA DSWx-S1 observation: {status.get('selected_opera_observation_date') or 'no eligible scene'}",
                  f"- Common valid support: {status.get('common_support_fraction') if status.get('common_support_fraction') is not None else 'not calculated'}",
                  f"- Release status: **{status.get('release_status', 'PROVISIONAL')}**",
                  f"- Independent review required: {status.get('review_required', True)}",
                  "",
              ])
              rtc = report.get("rtc_s1_alternative") or {}
              if rtc:
                  rtc_inventory = rtc.get("inventory") or {}
                  lines.extend([
                      f"- RTC-S1 fallback inventory: **{rtc.get('status', 'not queried')}**",
                      f"- RTC-S1 CMR AOI granules: {rtc_inventory.get('cmr_aoi_inventory_hits', 'not available')}",
                      f"- RTC-S1 VV burst groups: {rtc_inventory.get('parsed_rtc_burst_groups_with_vv', 'not available')}",
                      f"- RTC-S1 bursts inside discovery window: {rtc_inventory.get('bursts_within_discovery_window', 'not available')}",
                      f"- RTC-S1 bursts inside strict ±3-day score window: {rtc_inventory.get('bursts_within_strict_score_window', 'not available')}",
                      "",
                  ])
                  date_rows = rtc_inventory.get("nearest_available_acquisition_dates") or []
                  if date_rows:
                      lines.extend([
                          "| Nearest RTC-S1 date | Offset (days) | Burst groups | VV | VH | Mask |",
                          "|---|---:|---:|---:|---:|---:|",
                      ])
                      for row in date_rows[:5]:
                          lines.append(
                              f"| {row.get('observation_date')} | {row.get('date_offset_days')} | "
                              f"{row.get('burst_count')} | {row.get('vv_available_bursts')} | "
                              f"{row.get('vh_available_bursts')} | {row.get('mask_available_bursts')} |"
                          )
                      lines.append("")
                  lines.extend([
                      "RTC-S1 is backscatter only; this fallback inventory has not generated water labels or agreement metrics.",
                      "",
                  ])
              metrics = ((report.get("validation") or {}).get("metrics") or {})
              if metrics:
                  lines.extend(["| Metric | Value |", "|---|---:|"])
                  for key in ("accuracy", "precision_user_accuracy", "recall_producer_accuracy",
                              "f1_score", "intersection_over_union", "specificity", "cohen_kappa",
                              "area_bias_percent"):
                      value = metrics.get(key)
                      lines.append(f"| {key} | {'not available' if value is None else f'{float(value):.4f}'} |")
                  lines.append("")
              else:
                  lines.extend(["No accuracy metrics were calculated or published.", ""])
              lines.extend([
                  "**Interpretation:** OPERA DSWx-S1 is a Sentinel-1 C-band SAR-derived open-water cross-check, not field truth. Only OPERA WTR classes 0 and 1 are labelled; inundated vegetation and masked classes remain NoData. Do not use this water agreement score to claim validated erosion, deposition, bankline migration, sediment volume or flood causality.",
                  "",
                  "The original RiverShift source run and result remain unchanged and PROVISIONAL.",
              ])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Enforce independent-reference metrics gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f opera-output/opera_dswx_s1_validation_status.json ]; then
            echo "::error::No OPERA validation status report was produced."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("opera-output/opera_dswx_s1_validation_status.json").read_text(encoding="utf-8"))
          status = payload.get("status")
          print(f"RIVERSHIFT_OPERA_FINAL_STATUS={status}")
          if status != "METRICS_COMPUTED_REVIEW_REQUIRED":
              raise SystemExit(
                  "No eligible OPERA independent-reference metrics were produced; "
                  "the run is deliberately marked failed rather than green."
              )
          print("RIVERSHIFT_OPERA_METRICS_GATE=PASS")
          print("RIVERSHIFT_OPERA_RELEASE_STATUS=PROVISIONAL_REVIEW_REQUIRED")
          PY
